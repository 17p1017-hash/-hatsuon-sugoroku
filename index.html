<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>発音すごろく</title>

<style>

/* =========================================================
   基本
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  color:white;

  background:
    radial-gradient(circle at 10% 20%,white 0 1px,transparent 2px),
    radial-gradient(circle at 70% 30%,white 0 1px,transparent 2px),
    radial-gradient(circle at 35% 80%,white 0 1px,transparent 2px),
    linear-gradient(#102a61,#030818);

  background-size:
    100px 100px,
    150px 150px,
    190px 190px,
    auto;
}

button{
  font:inherit;
  touch-action:manipulation;
}


/* =========================================================
   起動画面
========================================================= */

#soundScreen{
  position:fixed;
  inset:0;
  z-index:1000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at 50% 30%,
      #224995,
      #07132e 50%,
      #020713 100%
    );
}

.soundBox{
  width:min(92vw,650px);

  padding:24px;

  border-radius:24px;

  background:
    rgba(255,255,255,.12);

  border:
    1px solid rgba(255,255,255,.22);

  backdrop-filter:blur(10px);

  text-align:center;

  box-shadow:
    0 20px 80px rgba(0,0,0,.45);
}

.soundBox h1{
  margin:0 0 5px;
  font-size:30px;
}

.soundSub{
  margin-bottom:20px;
  color:#dbe7ff;
  font-size:14px;
}

#soundButtons{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(90px,1fr));

  gap:10px;
}

.soundButton{
  min-height:76px;

  border:0;

  border-radius:17px;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #dfeaff
    );

  color:#10244a;

  font-size:30px;
  font-weight:bold;

  box-shadow:
    0 5px 0 #97acd8;

  cursor:pointer;
}

.soundButton:active{
  transform:translateY(3px);
  box-shadow:
    0 2px 0 #97acd8;
}

.soundButton small{
  display:block;
  margin-top:4px;

  font-size:10px;
  font-weight:normal;

  color:#60729a;
}

.soundButton:disabled{
  opacity:.4;
}


/* =========================================================
   アプリ
========================================================= */

#app{
  display:none;

  width:100vw;
  height:100dvh;

  flex-direction:column;

  padding:
    max(3px,env(safe-area-inset-top))
    max(4px,env(safe-area-inset-right))
    max(3px,env(safe-area-inset-bottom))
    max(4px,env(safe-area-inset-left));
}


/* =========================================================
   上部
========================================================= */

.topBar{
  height:30px;
  flex:0 0 30px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 5px;
}

.titleArea{
  display:flex;
  align-items:center;
  gap:8px;
}

.topBar h1{
  margin:0;
  font-size:15px;
}

.targetBadge{
  padding:3px 8px;

  border-radius:20px;

  background:#ffd84d;
  color:#172448;

  font-size:11px;
  font-weight:bold;
}

.changeSoundButton{
  border:
    1px solid rgba(255,255,255,.35);

  border-radius:7px;

  padding:3px 7px;

  background:
    rgba(255,255,255,.12);

  color:white;

  font-size:9px;
}


/* =========================================================
   メイン
========================================================= */

.gameArea{
  flex:1;
  min-height:0;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    clamp(190px,24vw,250px);

  gap:5px;
}


/* =========================================================
   マップ
========================================================= */

.mapPanel{
  min-width:0;
  min-height:0;

  position:relative;

  overflow:hidden;

  border-radius:14px;

  background:
    radial-gradient(
      circle at 10% 85%,
      rgba(40,150,255,.25),
      transparent 18%
    ),
    radial-gradient(
      circle at 82% 17%,
      rgba(180,90,255,.20),
      transparent 22%
    ),
    linear-gradient(
      135deg,
      rgba(14,42,89,.95),
      rgba(3,8,27,.98)
    );

  border:
    1px solid rgba(255,255,255,.16);
}


/* =========================================================
   背景
========================================================= */

.planetDecoration{
  position:absolute;
  pointer-events:none;

  opacity:.32;

  z-index:0;
}

.earth{
  left:2%;
  bottom:1%;
  font-size:38px;
}

.moon{
  right:3%;
  bottom:5%;
  font-size:26px;
}

.planet{
  right:4%;
  top:7%;
  font-size:31px;
}

.alienPlanet{
  left:33%;
  top:39%;
  font-size:38px;
}


/* =========================================================
   道
========================================================= */

#connections{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  z-index:1;

  pointer-events:none;
}

.pathLine{
  stroke:
    rgba(195,220,255,.52);

  stroke-width:1.1;

  stroke-linecap:round;
}

.pathLine.short{
  stroke:#69caff;
  stroke-width:1.5;
}

.pathLine.long{
  stroke:#7fe39a;
  stroke-width:1.5;
}


/* =========================================================
   マス
========================================================= */

.space{
  position:absolute;

  width:
    clamp(
      25px,
      3.35vw,
      40px
    );

  height:
    clamp(
      25px,
      3.35vw,
      40px
    );

  transform:
    translate(-50%,-50%);

  z-index:2;

  border-radius:9px;

  border:
    1.5px solid white;

  background:
    linear-gradient(
      #ffffff,
      #e9eeff
    );

  color:#10244a;

  box-shadow:
    0 2px 5px rgba(0,0,0,.42);

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-weight:bold;
}

.spaceNumber{
  font-size:
    clamp(
      8px,
      .9vw,
      11px
    );
}

.specialIcon{
  position:absolute;
  top:-8px;
  right:-7px;

  font-size:
    clamp(
      12px,
      1.5vw,
      18px
    );
}

.space.item{
  background:
    linear-gradient(
      #dbffe4,
      #7ee398
    );

  border-color:#baffc9;
}

.space.event{
  background:
    linear-gradient(
      #ffe1f3,
      #ff9bcf
    );

  border-color:#ffc3e4;
}

.space.rest{
  background:
    linear-gradient(
      #e0f3ff,
      #79c9ff
    );

  border-color:#bce7ff;
}

.space.branch{
  background:
    linear-gradient(
      #fff2bb,
      #ffc95e
    );

  border-color:#ffe08a;
}

.space.start{
  width:
    clamp(
      33px,
      4.4vw,
      50px
    );

  height:
    clamp(
      33px,
      4.4vw,
      50px
    );

  background:
    linear-gradient(
      #dcfbff,
      #69d7ff
    );
}

.space.goal{
  width:
    clamp(
      34px,
      4.5vw,
      52px
    );

  height:
    clamp(
      34px,
      4.5vw,
      52px
    );

  background:
    linear-gradient(
      #fffbb8,
      #ffd22c
    );

  border-color:#fff075;
}


/* =========================================================
   コマ
========================================================= */

.pieces{
  position:absolute;

  left:-8px;
  right:-8px;
  bottom:-12px;

  display:flex;
  justify-content:center;

  white-space:nowrap;

  pointer-events:none;

  font-size:
    clamp(
      16px,
      2vw,
      24px
    );
}

.pieceMoving{
  animation:
    jump .26s ease;
}

@keyframes jump{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:
      translateY(-9px)
      scale(1.13);
  }

  100%{
    transform:translateY(0);
  }

}


/* =========================================================
   右UI
========================================================= */

.sidePanel{
  min-height:0;

  display:flex;
  flex-direction:column;

  gap:4px;
}

.playerCard{
  padding:5px 7px;

  border:
    2px solid transparent;

  border-radius:11px;

  background:
    rgba(255,255,255,.12);
}

.playerCard.active{
  border-color:#ffd84d;

  background:
    rgba(255,255,255,.2);
}

.playerHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.playerName{
  font-size:
    clamp(
      10px,
      1.2vw,
      13px
    );

  font-weight:bold;
}

.playerPosition{
  font-size:
    clamp(
      8px,
      .95vw,
      10px
    );

  color:#dbe6ff;
}

.inventory{
  display:flex;
  flex-wrap:wrap;

  gap:3px;

  min-height:19px;

  margin-top:3px;
}

.itemButton{
  padding:2px 4px;

  border:0;
  border-radius:6px;

  background:white;
  color:#10244a;

  font-size:
    clamp(
      7px,
      .8vw,
      9px
    );

  font-weight:bold;
}

.itemButton:disabled{
  opacity:.45;
}

.emptyItem{
  color:#cbd7ef;
  font-size:8px;
}


/* =========================================================
   操作
========================================================= */

.controlBox{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;

  padding:6px;

  border-radius:12px;

  background:
    rgba(255,255,255,.12);
}

#turnText{
  text-align:center;

  font-size:
    clamp(
      11px,
      1.25vw,
      14px
    );

  font-weight:bold;
}

#dice{
  flex:1;

  min-height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:
    clamp(
      30px,
      5vw,
      48px
    );

  line-height:1;
}

#rollButton{
  width:100%;

  padding:
    clamp(
      6px,
      1vh,
      9px
    );

  border:0;
  border-radius:10px;

  background:#ffd84d;
  color:#14203e;

  font-size:
    clamp(
      10px,
      1.25vw,
      14px
    );

  font-weight:bold;
}

#rollButton:disabled{
  opacity:.4;
}

#message{
  min-height:23px;

  margin-top:3px;

  text-align:center;

  font-size:
    clamp(
      8px,
      .9vw,
      10px
    );

  line-height:1.25;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;

  gap:3px 6px;

  margin-top:4px;

  color:#dce6ff;

  font-size:
    clamp(
      6px,
      .75vw,
      8px
    );
}


/* =========================================================
   モーダル
========================================================= */

.overlay{
  position:fixed;
  inset:0;

  z-index:500;

  display:none;

  align-items:center;
  justify-content:center;

  padding:10px;

  background:
    rgba(0,0,0,.82);
}

.modal{
  width:
    min(
      90vw,
      430px
    );

  max-height:90dvh;
  overflow:auto;

  padding:16px;

  border-radius:20px;

  background:white;
  color:#13244a;

  text-align:center;

  box-shadow:
    0 20px 60px rgba(0,0,0,.6);
}

.modal h2{
  margin:
    3px 0 8px;
}

.bigPicture{
  font-size:
    clamp(
      45px,
      10vh,
      70px
    );
}

.bigWord{
  margin:4px 0 5px;

  font-size:
    clamp(
      32px,
      7vh,
      48px
    );

  font-weight:bold;
}

.practiceInstruction{
  font-size:
    clamp(
      14px,
      3vh,
      18px
    );

  font-weight:bold;
}

.modalButton{
  margin-top:10px;

  border:0;

  border-radius:12px;

  padding:
    10px 20px;

  background:#ffd84d;
  color:#14203e;

  font-size:16px;
  font-weight:bold;
}


/* =========================================================
   ルート選択
========================================================= */

.routeButtons{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:10px;
}

.routeButton{
  border:0;

  border-radius:14px;

  padding:12px 6px;

  color:#10244a;

  font-weight:bold;
}

.routeButton small{
  display:block;

  margin-top:5px;

  font-size:11px;

  line-height:1.3;
}

.routeShort{
  background:#bce5ff;
}

.routeLong{
  background:#c7f6cd;
}


/* =========================================================
   ぴったりサイコロ
========================================================= */

.numberButtons{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;

  margin-top:10px;
}

.numberButton{
  border:0;
  border-radius:12px;

  padding:11px;

  background:#dcecff;
  color:#10244a;

  font-size:21px;
  font-weight:bold;
}


/* =========================================================
   縦画面
========================================================= */

#rotateMessage{
  display:none;
}

@media
(orientation:portrait){

  #app.gameStarted #rotateMessage{
    position:fixed;
    inset:0;

    z-index:900;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:30px;

    background:#07142f;

    text-align:center;

    font-size:20px;
    font-weight:bold;
  }

}


/* =========================================================
   小さい横画面
========================================================= */

@media
(orientation:landscape)
and
(max-height:500px){

  .gameArea{
    grid-template-columns:
      minmax(0,1fr)
      220px;
  }

  .topBar{
    height:25px;
    flex-basis:25px;
  }

  .topBar h1{
    font-size:12px;
  }

  .space{
    width:
      clamp(
        24px,
        3vw,
        36px
      );

    height:
      clamp(
        24px,
        3vw,
        36px
      );

    border-radius:8px;
  }

  .space.start,
  .space.goal{
    width:
      clamp(
        29px,
        3.7vw,
        43px
      );

    height:
      clamp(
        29px,
        3.7vw,
        43px
      );
  }

}


/* =========================================================
   ロードエラー
========================================================= */

.errorText{
  color:#ffd2d2;
  margin-top:15px;
  font-size:12px;
}

</style>

</head>


<body>


<!-- =======================================================
     音選択画面
======================================================= -->

<div id="soundScreen">

  <div class="soundBox">

    <h1>🚀 発音すごろく</h1>

    <div class="soundSub">
      れんしゅうする音をえらんでね
    </div>

    <div id="soundButtons"></div>

    <div
      id="soundError"
      class="errorText"
    ></div>

  </div>

</div>



<!-- =======================================================
     ゲーム
======================================================= -->

<div id="app">

  <div id="rotateMessage">
    📱↔️<br><br>
    横向きにして遊んでね
  </div>


  <!-- 上 -->

  <header class="topBar">

    <div class="titleArea">

      <h1>
        🚀 発音すごろく
      </h1>

      <div
        id="targetBadge"
        class="targetBadge"
      >
        ターゲット：-
      </div>

    </div>

    <button
      class="changeSoundButton"
      onclick="backToSoundSelection()"
    >
      音をかえる
    </button>

  </header>



  <!-- メイン -->

  <main class="gameArea">


    <!-- =============================
         マップ
    ============================== -->

    <section
      id="mapPanel"
      class="mapPanel"
    >

      <div class="planetDecoration earth">
        🌍
      </div>

      <div class="planetDecoration moon">
        🌕
      </div>

      <div class="planetDecoration planet">
        🪐
      </div>

      <div class="planetDecoration alienPlanet">
        🌌
      </div>


      <svg
        id="connections"
        viewBox="0 0 100 100"
        preserveAspectRatio="none"
      ></svg>

      <div id="spaces"></div>

    </section>



    <!-- =============================
         右UI
    ============================== -->

    <aside class="sidePanel">


      <!-- 子ども -->

      <div
        id="playerCard0"
        class="playerCard active"
      >

        <div class="playerHeader">

          <div class="playerName">
            🚀 チャレンジャー
          </div>

          <div
            id="position0"
            class="playerPosition"
          >
            START
          </div>

        </div>

        <div
          id="inventory0"
          class="inventory"
        ></div>

      </div>


      <!-- 先生 -->

      <div
        id="playerCard1"
        class="playerCard"
      >

        <div class="playerHeader">

          <div class="playerName">
            🛸 先生
          </div>

          <div
            id="position1"
            class="playerPosition"
          >
            START
          </div>

        </div>

        <div
          id="inventory1"
          class="inventory"
        ></div>

      </div>



      <!-- 操作 -->

      <div class="controlBox">

        <div id="turnText">
          🚀 チャレンジャーのばん
        </div>

        <div id="dice">
          🎲
        </div>

        <button
          id="rollButton"
          onclick="rollDice()"
        >
          サイコロをふる
        </button>

        <div id="message">
          サイコロをふってね
        </div>

        <div class="legend">

          <span>
            🎁 アイテム
          </span>

          <span>
            🌠 宇宙イベント
          </span>

          <span>
            🔀 分かれ道
          </span>

          <span>
            💤 1回休み
          </span>

        </div>

      </div>

    </aside>

  </main>

</div>



<!-- =======================================================
     発音モーダル
======================================================= -->

<div
  id="practiceOverlay"
  class="overlay"
>

  <div class="modal">

    <div
      id="practicePicture"
      class="bigPicture"
    >
      🗣️
    </div>

    <div
      id="practiceWord"
      class="bigWord"
    ></div>

    <div class="practiceInstruction">
      3かいいってみよう！
    </div>

    <button
      class="modalButton"
      onclick="finishPractice()"
    >
      OK！
    </button>

  </div>

</div>



<!-- =======================================================
     情報モーダル
======================================================= -->

<div
  id="infoOverlay"
  class="overlay"
>

  <div class="modal">

    <h2 id="infoTitle"></h2>

    <div id="infoText"></div>

    <button
      class="modalButton"
      onclick="closeInfo()"
    >
      OK
    </button>

  </div>

</div>



<!-- =======================================================
     ルート選択
======================================================= -->

<div
  id="routeOverlay"
  class="overlay"
>

  <div class="modal">

    <h2>
      🔀 どっちにいく？
    </h2>

    <div class="routeButtons">

      <button
        class="routeButton routeShort"
        onclick="selectRoute('short')"
      >
        ⚡ ちかみち

        <small>
          マスは少ない<br>
          💤 1回休みがある
        </small>
      </button>

      <button
        class="routeButton routeLong"
        onclick="selectRoute('long')"
      >
        🎁 ながいみち

        <small>
          マスは多い<br>
          アイテムが多い
        </small>
      </button>

    </div>

  </div>

</div>



<!-- =======================================================
     ぴったりサイコロ
======================================================= -->

<div
  id="exactOverlay"
  class="overlay"
>

  <div class="modal">

    <h2>
      🎯 ぴったりサイコロ
    </h2>

    <div>
      すきな数字をえらんでね
    </div>

    <div class="numberButtons">

      <button class="numberButton" onclick="chooseExact(1)">1</button>
      <button class="numberButton" onclick="chooseExact(2)">2</button>
      <button class="numberButton" onclick="chooseExact(3)">3</button>
      <button class="numberButton" onclick="chooseExact(4)">4</button>
      <button class="numberButton" onclick="chooseExact(5)">5</button>
      <button class="numberButton" onclick="chooseExact(6)">6</button>

    </div>

  </div>

</div>



<!-- =======================================================
     sounds.js
     map.js
======================================================= -->

<script src="./sounds.js"></script>
<script src="./map.js"></script>


<script>

/* =========================================================
   グローバル
========================================================= */

let selectedSound = null;
let ALL_WORDS = [];

let currentPlayer = 0;

let busy = false;
let gameEnded = false;
let extraTurn = false;

let practiceCallback = null;
let infoCallback = null;

let pendingMovement = null;
let pendingRouteResolve = null;


/* =========================================================
   プレイヤー
========================================================= */

const players = [

  {
    name:"チャレンジャー",
    icon:"🚀",

    node:"start",

    history:[
      "start"
    ],

    items:[],

    skip:false,

    double:false,

    exact:false,

    routes:{}
  },

  {
    name:"先生",
    icon:"🛸",

    node:"start",

    history:[
      "start"
    ],

    items:[],

    skip:false,

    double:false,

    exact:false,

    routes:{}
  }

];


/* =========================================================
   起動
========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    createSoundButtons();

  }
);


/* =========================================================
   音選択
========================================================= */

function createSoundButtons(){

/* =========================================================
   Wordファイル読込
========================================================= */

function loadSound(sound){

  document.getElementById(
    "soundError"
  ).textContent =
    "よみこみ中…";

  /*
    前のデータを消す
  */

  window.WORD_DATA = null;


  /*
    古いWordスクリプトを消す
  */

  const oldScript =
    document.getElementById(
      "wordDataScript"
    );

  if(oldScript){
    oldScript.remove();
  }


  /*
    新しいファイル
  */

  const script =
    document.createElement(
      "script"
    );

  script.id =
    "wordDataScript";

  script.src =
    sound.file +
    "?v=" +
    Date.now();


  script.onload =
    () => {

      if(
        !window.WORD_DATA
      ){

        document.getElementById(
          "soundError"
        ).textContent =
          sound.label +
          " の単語データがありません。";

        return;

      }

      selectedSound = sound;

      startGame();

    };


  script.onerror =
    () => {

      document.getElementById(
        "soundError"
      ).textContent =
        sound.file +
        " を読み込めませんでした。";

    };


  document.body.appendChild(
    script
  );

}

function resetPlayers(){

/* =========================================================
   MAPノード取得
========================================================= */

function getNode(id){

  return MAP_DATA.nodes.find(
    node =>
      node.id === id
  );

}


/* =========================================================
   Board作成
========================================================= */

function createBoard(){

  const spaces =
    document.getElementById(
      "spaces"
    );

  spaces.innerHTML = "";


  MAP_DATA.nodes.forEach(node => {

    const el =
      document.createElement(
        "div"
      );

    el.id =
      "node-" +
      node.id;

    el.className =
      "space " +
      (
        node.type ||
        "normal"
      );

    el.style.left =
      node.x + "%";

    el.style.top =
      node.y + "%";


    let content = "";


    if(
      node.type === "start"
    ){

      content =
        `<span class="spaceNumber">START</span>`;

    }

    else if(
      node.type === "goal"
    ){

      content =
        `<span class="spaceNumber">GOAL</span>`;

    }

    else{

      content =
        `<span class="spaceNumber">${node.label}</span>`;

    }


    if(
      node.type === "item"
    ){

      content +=
        `<span class="specialIcon">🎁</span>`;

    }

    if(
      node.type === "event"
    ){

      content +=
        `<span class="specialIcon">🌠</span>`;

    }

    if(
      node.type === "rest"
    ){

      content +=
        `<span class="specialIcon">💤</span>`;

    }

    if(
      node.type === "branch"
    ){

      content +=
        `<span class="specialIcon">🔀</span>`;

    }


    content +=
      `<div class="pieces" id="pieces-${node.id}"></div>`;


    el.innerHTML =
      content;


    spaces.appendChild(
      el
    );

  });


  drawConnections();

  renderPieces();

}


/* =========================================================
   道を描画
========================================================= */

function drawConnections(){

  const svg =
    document.getElementById(
      "connections"
    );

  svg.innerHTML = "";


  MAP_DATA.links.forEach(link => {

    const start =
      getNode(
        link[0]
      );

    const end =
      getNode(
        link[1]
      );


    if(
      !start ||
      !end
    ){
      return;
    }


    const line =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line"
      );


    line.setAttribute(
      "x1",
      start.x
    );

    line.setAttribute(
      "y1",
      start.y
    );

    line.setAttribute(
      "x2",
      end.x
    );

    line.setAttribute(
      "y2",
      end.y
    );


    let lineClass =
      "pathLine";


    if(link[2] === "short"){
      lineClass +=
        " short";
    }

    if(link[2] === "long"){
      lineClass +=
        " long";
    }


    line.setAttribute(
      "class",
      lineClass
    );


    svg.appendChild(
      line
    );

  });

}

/* =========================================================
   サイコロ
========================================================= */

async function rollDice(){

  if(
    busy ||
    gameEnded
  ){
    return;
  }


  const player =
    players[
      currentPlayer
    ];


  /*
    一回休み
  */

  if(
    player.skip
  ){

    player.skip = false;

    showInfo(
      "💤 1回休み",
      player.name +
      "は今回はお休み！",
      () => {
        nextTurn();
      }
    );

    return;

  }


  /*
    ぴったりサイコロ
  */

  if(
    player.exact
  ){

    document.getElementById(
      "exactOverlay"
    ).style.display =
      "flex";

    return;

  }


  busy = true;

  updateUI();


  let total = 0;


  if(
    player.double
  ){

    const d1 =
      randomDice();

    const d2 =
      randomDice();

    total =
      d1 + d2;

    player.double = false;


    document.getElementById(
      "dice"
    ).textContent =
      diceFace(d1) +
      diceFace(d2);

  }

  else{

    total =
      randomDice();

    document.getElementById(
      "dice"
    ).textContent =
      diceFace(total);

  }


  document.getElementById(
    "message"
  ).textContent =
    total +
    "マスすすむ！";


  await sleep(
    350
  );


  await moveForward(
    currentPlayer,
    total
  );

}


/* =========================================================
   サイコロ数字
========================================================= */

function randomDice(){

  return (
    Math.floor(
      Math.random() * 6
    ) + 1
  );

}


function diceFace(number){

  const faces = [
    "",
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
  ];

  return faces[number];

}


/* =========================================================
   次のノード
========================================================= */

async function getNextNode(
  playerIndex
){

  const player =
    players[
      playerIndex
    ];

  const current =
    player.node;


  const links =
    MAP_DATA.links.filter(
      link =>
        link[0] === current
    );


  if(
    links.length === 0
  ){

    return null;

  }


  if(
    links.length === 1
  ){

    return links[0][1];

  }


  /*
    分岐
  */

  const saved =
    player.routes[
      current
    ];


  if(saved){

    const matched =
      links.find(
        link =>
          link[2] === saved
      );

    if(matched){
      return matched[1];
    }

  }


  const route =
    await askRoute();


  player.routes[
    current
  ] = route;


  const matched =
    links.find(
      link =>
        link[2] === route
    );


  return matched
    ? matched[1]
    : links[0][1];

}


/* =========================================================
   前進
========================================================= */

async function moveForward(
  playerIndex,
  steps
){

  const player =
    players[
      playerIndex
    ];


  for(
    let i = 0;
    i < steps;
    i++
  ){

    const next =
      await getNextNode(
        playerIndex
      );


    if(!next){
      break;
    }


    player.node =
      next;

    player.history.push(
      next
    );


    renderPieces(
      playerIndex
    );

    updateUI();


    await sleep(
      270
    );


    const node =
      getNode(
        next
      );


    if(
      node &&
      node.type === "goal"
    ){

      await goal(
        playerIndex
      );

      return;

    }

  }


  await landing(
    playerIndex
  );

}


/* =========================================================
   後退
========================================================= */

async function moveBackward(
  playerIndex,
  steps
){

  const player =
    players[
      playerIndex
    ];


  for(
    let i = 0;
    i < steps;
    i++
  ){

    if(
      player.history.length <= 1
    ){
      break;
    }


    player.history.pop();


    player.node =
      player.history[
        player.history.length - 1
      ];


    renderPieces(
      playerIndex
    );

    updateUI();


    await sleep(
      270
    );

  }

}


/* =========================================================
   止まったマス
========================================================= */

async function landing(
  playerIndex
){

  const player =
    players[
      playerIndex
    ];

  const node =
    getNode(
      player.node
    );


  /*
    発音は毎回行う
  */

  await practice();


  if(
    gameEnded
  ){
    return;
  }


  /*
    アイテム
  */

  if(
    node &&
    node.type === "item"
  ){

    await itemLanding(
      playerIndex
    );

  }


  /*
    イベント
  */

  else if(
    node &&
    node.type === "event"
  ){

    await spaceEvent();

  }


  /*
    1回休み
  */

  else if(
    node &&
    node.type === "rest"
  ){

    player.skip = true;

    await showInfoPromise(
      "💤 1回休み",
      "次のばんは1回お休み！"
    );

  }


  finishTurn();

}

/* =========================================================
   アイテムマス
========================================================= */

async function itemLanding(
  playerIndex
){

  const player =
    players[
      playerIndex
    ];


  /*
    横どり 8%
  */

  if(
    Math.random() < .08
  ){

    await autoSteal(
      playerIndex
    );

    return;

  }


  const item =
    weightedItem();


  if(
    player.items.length >= 3
  ){

    await showInfoPromise(
      "🎁 アイテム",
      item.icon +
      " " +
      item.name +
      "！<br><br>でも持てるアイテムは3個まで！"
    );

    return;

  }


  player.items.push(
    {
      ...item
    }
  );


  updateUI();


  await showInfoPromise(
    "🎁 アイテムGET！",
    item.icon +
    " <b>" +
    item.name +
    "</b>"
  );

}


/* =========================================================
   重み付き抽選
========================================================= */

function weightedItem(){

  const total =
    ITEM_POOL.reduce(
      (sum,item) =>
        sum + item.weight,
      0
    );


  let random =
    Math.random() *
    total;


  for(
    const item of ITEM_POOL
  ){

    random -=
      item.weight;

    if(
      random <= 0
    ){

      return item;

    }

  }


  return ITEM_POOL[0];

}


/* =========================================================
   横どり
========================================================= */

async function autoSteal(
  playerIndex
){

  const opponentIndex =
    playerIndex === 0
      ? 1
      : 0;

  const player =
    players[
      playerIndex
    ];

  const opponent =
    players[
      opponentIndex
    ];


  const barrierIndex =
    opponent.items.findIndex(
      item =>
        item.id === "barrier"
    );


  if(
    barrierIndex >= 0
  ){

    opponent.items.splice(
      barrierIndex,
      1
    );

    updateUI();


    await showInfoPromise(
      "🛡️ バリア！",
      opponent.name +
      "のバリアが横どりを防いだ！"
    );

    return;

  }


  if(
    opponent.items.length === 0
  ){

    await showInfoPromise(
      "🎁 よこどり",
      "でも相手はアイテムを持っていなかった！"
    );

    return;

  }


  const index =
    Math.floor(
      Math.random() *
      opponent.items.length
    );


  const stolen =
    opponent.items.splice(
      index,
      1
    )[0];


  if(
    player.items.length < 3
  ){

    player.items.push(
      stolen
    );

  }


  updateUI();


  await showInfoPromise(
    "🎁 よこどり！",
    stolen.icon +
    " " +
    stolen.name +
    "をゲット！"
  );

}


/* =========================================================
   アイテム使用
========================================================= */

async function useItem(
  playerIndex,
  itemIndex
){

  if(
    busy ||
    gameEnded ||
    playerIndex !== currentPlayer
  ){
    return;
  }


  const player =
    players[
      playerIndex
    ];

  const item =
    player.items[
      itemIndex
    ];


  if(!item){
    return;
  }


  /*
    バリアは自動使用なので
    手動では使わない
  */

  if(
    item.id === "barrier"
  ){

    showInfo(
      "🛡️ バリア",
      "バリアは攻撃されたときに自動で使います。"
    );

    return;

  }


  player.items.splice(
    itemIndex,
    1
  );

  updateUI();


  if(
    item.id === "plus3"
  ){

    busy = true;

    await moveForward(
      playerIndex,
      3
    );

    return;

  }


  if(
    item.id === "double"
  ){

    player.double = true;

    document.getElementById(
      "message"
    ).textContent =
      "次のサイコロが2個になります！";

  }


  else if(
    item.id === "exact"
  ){

    player.exact = true;

    document.getElementById(
      "message"
    ).textContent =
      "次のサイコロの数字を選べます！";

  }


  else if(
    item.id === "swap"
  ){

    swapPlayers();

    await showInfoPromise(
      "🔄 いれかえ",
      "2人の場所が入れかわった！"
    );

  }


  else if(
    item.id === "back3"
  ){

    await attackBack3(
      playerIndex
    );

  }


  else if(
    item.id === "again"
  ){

    extraTurn = true;

    document.getElementById(
      "message"
    ).textContent =
      "このばんのあと、もう1回！";

  }


  updateUI();

}


/* =========================================================
   3マス戻す
========================================================= */

async function attackBack3(
  playerIndex
){

  const opponentIndex =
    playerIndex === 0
      ? 1
      : 0;

  const opponent =
    players[
      opponentIndex
    ];


  const barrierIndex =
    opponent.items.findIndex(
      item =>
        item.id === "barrier"
    );


  if(
    barrierIndex >= 0
  ){

    opponent.items.splice(
      barrierIndex,
      1
    );

    updateUI();


    await showInfoPromise(
      "🛡️ バリア！",
      opponent.name +
      "のバリアが守った！"
    );

    return;

  }


  await showInfoPromise(
    "🌀 3マスもどる！",
    opponent.name +
    "が3マスもどります。"
  );


  await moveBackward(
    opponentIndex,
    3
  );

}


/* =========================================================
   入れ替え
========================================================= */

function swapPlayers(){

  const node0 =
    players[0].node;

  const history0 =
    [
      ...players[0].history
    ];


  players[0].node =
    players[1].node;

  players[0].history =
    [
      ...players[1].history
    ];


  players[1].node =
    node0;

  players[1].history =
    history0;


  renderPieces();

  updateUI();

}

async function spaceEvent(){

  const events = [

    {
      title:"🌀 ワームホール！",
      text:"2人とも5マスすすむ！",
      amount:5
    },

    {
      title:"☄️ いん石！",
      text:"2人とも3マスもどる！",
      amount:-3
    },

    {
      title:"🌟 スピードアップ！",
      text:"2人とも2マスすすむ！",
      amount:2
    },

    {
      title:"🌌 宇宙の風！",
      text:"2人とも1マスもどる！",
      amount:-1
    }

  ];


  const event =
    events[
      Math.floor(
        Math.random() *
        events.length
      )
    ];


  await showInfoPromise(
    event.title,
    event.text
  );


  for(
    let i = 0;
    i < players.length;
    i++
  ){

    if(
      event.amount > 0
    ){

      await moveWithoutLanding(
        i,
        event.amount
      );

    }

    else{

      await moveBackward(
        i,
        Math.abs(
          event.amount
        )
      );

    }

  }

}


/* =========================================================
   イベント用前進
   発音・特殊マス効果は発動しない
========================================================= */

async function moveWithoutLanding(
  playerIndex,
  steps
){

  const player =
    players[
      playerIndex
    ];


  for(
    let i = 0;
    i < steps;
    i++
  ){

    const next =
      await getNextNode(
        playerIndex
      );


    if(!next){
      break;
    }


    player.node =
      next;

    player.history.push(
      next
    );


    renderPieces(
      playerIndex
    );

    updateUI();


    await sleep(
      220
    );


    const node =
      getNode(
        next
      );


    if(
      node &&
      node.type === "goal"
    ){

      await goal(
        playerIndex
      );

      return;

    }

  }

}


/* =========================================================
   GOAL
========================================================= */

async function goal(
  playerIndex
){

  gameEnded = true;

  busy = true;


  const player =
    players[
      playerIndex
    ];


  await practice();


  showInfo(
    "🎉 GOAL！",
    player.icon +
    " " +
    player.name +
    "のゴール！<br><br>" +
    "宇宙の旅クリア！"
  );


  updateUI();

}


/* =========================================================
   ターン終了
========================================================= */

function finishTurn(){

  if(
    gameEnded
  ){
    return;
  }


  if(
    extraTurn
  ){

    extraTurn = false;

    busy = false;

    document.getElementById(
      "message"
    ).textContent =
      "もう1回サイコロをふれるよ！";

    updateUI();

    return;

  }


  nextTurn();

}


/* =========================================================
   次のターン
========================================================= */

function nextTurn(){

  currentPlayer =
    currentPlayer === 0
      ? 1
      : 0;


  busy = false;


  document.getElementById(
    "dice"
  ).textContent =
    "🎲";


  document.getElementById(
    "message"
  ).textContent =
    "サイコロをふってね";


  updateUI();

}


/* =========================================================
   分岐
========================================================= */

function askRoute(){

  return new Promise(
    resolve => {

      pendingRouteResolve =
        resolve;


      document.getElementById(
        "routeOverlay"
      ).style.display =
        "flex";

    }
  );

}


function selectRoute(
  route
){

  document.getElementById(
    "routeOverlay"
  ).style.display =
    "none";


  if(
    pendingRouteResolve
  ){

    const resolve =
      pendingRouteResolve;

    pendingRouteResolve =
      null;

    resolve(
      route
    );

  }

}


/* =========================================================
   情報
========================================================= */

function showInfo(
  title,
  text,
  callback = null
){

  document.getElementById(
    "infoTitle"
  ).innerHTML =
    title;


  document.getElementById(
    "infoText"
  ).innerHTML =
    text;


  infoCallback =
    callback;


  document.getElementById(
    "infoOverlay"
  ).style.display =
    "flex";

}


function closeInfo(){

  document.getElementById(
    "infoOverlay"
  ).style.display =
    "none";


  if(
    infoCallback
  ){

    const callback =
      infoCallback;

    infoCallback =
      null;

    callback();

  }

}


function showInfoPromise(
  title,
  text
){

  return new Promise(
    resolve => {

      showInfo(
        title,
        text,
        resolve
      );

    }
  );

}


/* =========================================================
   待機
========================================================= */

function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}
