<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>発音すごろく 宇宙の旅</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:
    radial-gradient(circle at 10% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 70% 35%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 40% 75%,#fff 0 1px,transparent 2px),
    linear-gradient(#102a61,#030818);
  background-size:100px 100px,140px 140px,180px 180px,auto;
}

button{
  font:inherit;
  touch-action:manipulation;
}

#app{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:6px;
}

.topTitle{
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.topTitle h1{
  margin:0;
  font-size:21px;
}

.topTitle span{
  color:#cbd9ff;
  font-size:12px;
}

.gameLayout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 260px;
  gap:7px;
}

.boardPanel{
  background:rgba(0,0,0,.22);
  border-radius:16px;
  padding:5px;
  min-width:0;
}

#boardStage{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  max-height:calc(100dvh - 48px);
  overflow:hidden;
  border-radius:14px;

  background:
    radial-gradient(circle at 7% 83%,#3d9ded 0 18px,#2266a8 19px 30px,transparent 31px),
    radial-gradient(circle at 92% 12%,#9661e9 0 17px,#5d369d 18px 28px,transparent 29px),
    radial-gradient(circle at 53% 47%,rgba(153,89,255,.18),transparent 23%),
    linear-gradient(135deg,rgba(19,48,98,.8),rgba(3,7,30,.95));
}

#connections{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  pointer-events:none;
}

.pathLine{
  stroke:rgba(205,226,255,.42);
  stroke-width:1.1;
  stroke-linecap:round;
}

.pathLine.short{
  stroke:#6fc9ff;
  stroke-width:1.4;
}

.pathLine.long{
  stroke:#82e79a;
  stroke-width:1.4;
}

.zone{
  position:absolute;
  z-index:0;
  font-size:clamp(10px,1.25vw,18px);
  font-weight:bold;
  opacity:.2;
  pointer-events:none;
}

.space{
  position:absolute;

  width:clamp(27px,3.6vw,43px);
  height:clamp(27px,3.6vw,43px);

  transform:translate(-50%,-50%);

  border-radius:11px;
  border:1.5px solid white;

  background:#f5f7ff;
  color:#10244a;

  box-shadow:0 2px 5px rgba(0,0,0,.38);

  z-index:2;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
  font-weight:bold;
}

.spaceNumber{
  position:absolute;
  top:1px;
  left:3px;
  font-size:clamp(6px,.75vw,9px);
  opacity:.65;
}

.spaceIcon{
  font-size:clamp(13px,1.7vw,20px);
  line-height:1;
}

.spaceLabel{
  font-size:clamp(5px,.65vw,8px);
  margin-top:2px;
  line-height:1;
}

.normal{
  background:linear-gradient(#fff,#e9eeff);
}

.itemSpace{
  background:linear-gradient(#d9ffe0,#84e99b);
}

.eventSpace{
  background:linear-gradient(#ffe0f2,#ffafd7);
}

.restSpace{
  background:linear-gradient(#dff3ff,#8ed1ff);
}

.branchSpace{
  background:linear-gradient(#fff2c5,#ffc76b);
  border-color:#ffe38e;
}

.startSpace{
  background:linear-gradient(#d8f9ff,#70d9ff);
}

.goalSpace{
  background:linear-gradient(#fff8b7,#ffd636);
  border-color:#fff3a1;
}

.routeShort{
  border-color:#69c8ff;
}

.routeLong{
  border-color:#7ce292;
}

.pieces{
  position:absolute;
  left:-8px;
  right:-8px;
  bottom:-13px;
  display:flex;
  justify-content:center;
  font-size:clamp(18px,2.1vw,25px);
  white-space:nowrap;
  pointer-events:none;
}

.pieceMoving{
  animation:jump .3s ease;
}

@keyframes jump{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px) scale(1.15)}
  100%{transform:translateY(0)}
}

.sidePanel{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:0;
}

.player{
  background:rgba(255,255,255,.12);
  border-radius:12px;
  border:2px solid transparent;
  padding:6px 8px;
}

.player.active{
  border-color:#ffd84d;
  background:rgba(255,255,255,.2);
}

.playerTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.player-title{
  font-size:13px;
  font-weight:bold;
}

.player-position{
  font-size:11px;
  color:#dce6ff;
}

.inventory{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  min-height:23px;
  margin-top:3px;
}

.item{
  padding:3px 5px;
  border-radius:7px;
  background:white;
  color:#10244a;
  font-size:9px;
  font-weight:bold;
}

.controlBox{
  flex:1;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.12);
  border-radius:14px;
  padding:7px;
}

#turnText{
  text-align:center;
  font-size:14px;
  font-weight:bold;
}

#dice{
  text-align:center;
  font-size:46px;
  line-height:1.05;
  min-height:49px;
}

.mainButton{
  width:100%;
  border:0;
  border-radius:11px;
  padding:9px 5px;
  background:#ffd84d;
  color:#14203e;
  font-size:14px;
  font-weight:bold;
}

.mainButton:disabled{
  opacity:.4;
}

#message{
  text-align:center;
  min-height:28px;
  margin-top:4px;
  font-size:11px;
  line-height:1.25;
}

.itemTitle{
  margin:5px 0 3px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}

.help{
  text-align:center;
  font-size:9px;
  line-height:1.25;
  color:#dce6ff;
  margin-top:3px;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.82);
}

.modal{
  width:min(90vw,430px);
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:17px;
  background:white;
  color:#13244a;
  text-align:center;
}

.bigEmoji{
  font-size:62px;
}

.bigWord{
  margin:4px 0;
  font-size:40px;
  font-weight:bold;
}

.okButton{
  margin-top:10px;
  border:0;
  border-radius:12px;
  padding:10px 20px;
  background:#ffd84d;
  color:#14203e;
  font-size:17px;
  font-weight:bold;
}

.routes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.routeButton{
  border:0;
  border-radius:14px;
  padding:12px 5px;
  color:#10244a;
  font-size:16px;
  font-weight:bold;
}

.routeButton small{
  display:block;
  margin-top:5px;
  font-size:11px;
  line-height:1.35;
}

.shortRoute{
  background:#bde4ff;
}

.longRoute{
  background:#c7f7cd;
}

.numberButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.numberButton{
  border:0;
  border-radius:12px;
  padding:12px;
  background:#dcecff;
  color:#10244a;
  font-size:22px;
  font-weight:bold;
}

@media(orientation:portrait){

  .gameLayout{
    grid-template-columns:1fr;
  }

  #boardStage{
    min-width:700px;
  }

  .boardPanel{
    overflow-x:auto;
  }

  .sidePanel{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .controlBox{
    grid-column:1 / -1;
  }
}

@media(orientation:landscape) and (max-height:500px){

  #app{
    padding:3px;
  }

  .topTitle{
    height:25px;
  }

  .topTitle h1{
    font-size:16px;
  }

  .topTitle span{
    font-size:9px;
  }

  .gameLayout{
    grid-template-columns:minmax(0,1fr) 225px;
    gap:4px;
  }

  .player{
    padding:3px 5px;
  }

  .player-title{
    font-size:11px;
  }

  .item{
    font-size:8px;
    padding:2px 4px;
  }

  #dice{
    font-size:37px;
    min-height:38px;
  }

  .mainButton{
    padding:6px;
    font-size:12px;
  }

  #message{
    font-size:9px;
    min-height:21px;
  }
}
</style>
</head>

    name:"チャレンジャー",

function nodeIcon(node){

  if(node.type==="start") return "🌍";
  if(node.type==="goal") return "🪐";
  if(node.type==="item") return "🎁";
  if(node.type==="event") return "🌠";
  if(node.type==="rest") return "💤";
  if(node.type==="branch") return "🔀";

  return "⭐";
}

function nodeText(node){

  if(node.type==="start") return "START";
  if(node.type==="goal") return "GOAL";
  if(node.type==="item") return "ITEM";
  if(node.type==="event") return "EVENT";
  if(node.type==="rest") return "休み";
  if(node.type==="branch") return "分岐";

  return "";
}

function createBoard(){

  Object.values(NODES).forEach(node=>{

    const el=
      document.createElement("div");

    let cls="space ";

    if(node.type==="item") cls+="itemSpace";
    else if(node.type==="event") cls+="eventSpace";
    else if(node.type==="rest") cls+="restSpace";
    else if(node.type==="branch") cls+="branchSpace";
    else if(node.type==="start") cls+="startSpace";
    else if(node.type==="goal") cls+="goalSpace";
    else cls+="normal";

    if(node.route==="short"){
      cls+=" routeShort";
    }

    if(node.route==="long"){
      cls+=" routeLong";
    }

    el.className=cls;
    el.id=`node-${node.id}`;

    el.style.left=`${node.x}%`;
    el.style.top=`${node.y}%`;

    el.innerHTML=`
      <div class="spaceNumber">${node.label}</div>
      <div class="spaceIcon">${nodeIcon(node)}</div>
      <div class="spaceLabel">${nodeText(node)}</div>
      <div class="pieces"></div>
    `;

    boardStage.appendChild(el);

  });

  drawConnections();
  renderPieces();
}

function drawConnections(){

  connections.innerHTML="";

  Object.values(NODES).forEach(node=>{

    node.next.forEach(nextId=>{

      const next=NODES[nextId];

      const line=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      line.setAttribute("x1",node.x);
      line.setAttribute(
        "y1",
        node.y*0.5625
      );

      line.setAttribute("x2",next.x);
      line.setAttribute(
        "y2",
        next.y*0.5625
      );

      let cls="pathLine";

      if(next.route==="short"){
        cls+=" short";
      }

      if(next.route==="long"){
        cls+=" long";
      }

      line.setAttribute("class",cls);

      connections.appendChild(line);

    });

  });
}

function renderPieces(moving=null){

  document
    .querySelectorAll(".pieces")
    .forEach(el=>{
      el.innerHTML="";
    });

  players.forEach((player,index)=>{

    const node=
      document.getElementById(
        `node-${player.node}`
      );

    if(!node) return;

    const holder=
      node.querySelector(".pieces");

    const piece=
      document.createElement("span");

    piece.textContent=
      player.piece;

    if(index===moving){
      piece.className="pieceMoving";
    }

    holder.appendChild(piece);

  });

  updateUI();
}

function updateUI(){

  players.forEach((player,index)=>{

    document
      .getElementById(
        `playerCard${index}`
      )
      .classList.toggle(
        "active",
        index===currentPlayer
      );

    const node=NODES[player.node];

    document.getElementById(
      `pos${index}`
    ).textContent=
      node.progress===0
      ? "START"
      : `${node.progress}`;

    const inventory=
      document.getElementById(
        `inventory${index}`
      );

    inventory.innerHTML="";

    if(player.items.length===0){

      inventory.innerHTML=
        `<span style="font-size:9px;opacity:.65;">アイテムなし</span>`;

    }

    player.items.forEach(item=>{

      const el=
        document.createElement("div");

      el.className="item";

      el.textContent=
        `${item.emoji} ${item.name}`;

      inventory.appendChild(el);

    });

  });

  const player=
    players[currentPlayer];

  turnText.textContent=
    `${player.piece} ${player.name}のばん`;

  const usable=
    player.items.filter(
      item=>item.id!=="barrier"
    );

  itemButton.disabled=
    busy ||
    gameEnded ||
    usable.length===0;

  rollButton.disabled=
    busy || gameEnded;
}

function wait(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}

function chooseRoute(){

  return new Promise(resolve=>{

    const overlay=
      document.getElementById(
        "routeOverlay"
      );

    overlay.style.display="flex";

    document.getElementById(
      "shortButton"
    ).onclick=()=>{

      overlay.style.display="none";
      resolve("short");

    };

    document.getElementById(
      "longButton"
    ).onclick=()=>{

      overlay.style.display="none";
      resolve("long");

    };

  });

}

async function getNextNode(playerIndex){

  const player=
    players[playerIndex];

  const node=
    NODES[player.node];

  if(node.next.length===0){
    return null;
  }

  if(node.type==="branch"){

    let choice=
      player.routes[node.id];

    if(!choice){

      choice=
        await chooseRoute();

      player.routes[node.id]=choice;

    }

    return node.next.find(id=>
      NODES[id].route===choice
    );

  }

  return node.next[0];
}

async function moveForward(
  playerIndex,
  steps
){

  const player=
    players[playerIndex];

  for(let i=0;i<steps;i++){

    if(player.node==="goal"){
      break;
    }

    const next=
      await getNextNode(
        playerIndex
      );

    if(!next){
      break;
    }

    player.node=next;

    renderPieces(
      playerIndex
    );

    await wait(280);

  }

}

function previousNodes(nodeId){

  return Object
    .values(NODES)
    .filter(node=>
      node.next.includes(nodeId)
    )
    .map(node=>node.id);

}

async function moveBackward(
  playerIndex,
  steps
){

  const player=
    players[playerIndex];

  for(let i=0;i<steps;i++){

    if(player.node==="start"){
      break;
    }

    const list=
      previousNodes(player.node);

    if(list.length===0){

      player.node="start";

    }

    else if(list.length===1){

      player.node=list[0];

    }

    else{

      let chosen=null;

      for(const id of list){

        const route=
          NODES[id].route;

        if(
          route &&
          Object.values(
            player.routes
          ).includes(route)
        ){

          chosen=id;
          break;

        }

      }

      player.node=
        chosen || list[0];

    }

    renderPieces(
      playerIndex
    );

    await wait(250);

  }

}

function pronunciation(
  playerIndex=currentPlayer
){

  return new Promise(resolve=>{

    const player=
      players[playerIndex];

    const progress=
      Math.max(
        1,
        NODES[player.node].progress
      );

    const word=
      ALL_WORDS[
        (progress-1)%
        ALL_WORDS.length
      ];

    document.getElementById(
      "wordEmoji"
    ).textContent=
      word.emoji;

    document.getElementById(
      "wordText"
    ).textContent=
      word.word;

    const overlay=
      document.getElementById(
        "wordOverlay"
      );

    overlay.style.display="flex";

    document.getElementById(
      "wordOK"
    ).onclick=()=>{

      overlay.style.display="none";

      resolve();

    };

  });

}

      resolve();

    };

  });

}

const ITEM_POOL=[
  {
    id:"plus3",
    name:"3マス",
    emoji:"🚀",
    weight:28
  },
  {
    id:"double",
    name:"ダブル",
    emoji:"🎲🎲",
    weight:22
  },
  {
    id:"barrier",
    name:"バリア",
    emoji:"🛡️",
    weight:18
  },
  {
    id:"exact",
    name:"ぴったり",
    emoji:"🎯",
    weight:14
  },
  {
    id:"swap",
    name:"いれかえ",
    emoji:"🔄",
    weight:8
  },
  {
    id:"back3",
    name:"3もどす",
    emoji:"🌀",
    weight:6
  },
  {
    id:"again",
    name:"もう1回",
    emoji:"🎲",
    weight:4
  }
];

function randomItem(){

  const total=
    ITEM_POOL.reduce(
      (a,b)=>a+b.weight,
      0
    );

  let r=
    Math.random()*total;

  for(const item of ITEM_POOL){

    r-=item.weight;

    if(r<=0){

      return {...item};

    }

  }

  return {...ITEM_POOL[0]};
}

function useBarrier(player){

  const i=
    player.items.findIndex(
      item=>item.id==="barrier"
    );

  if(i===-1){
    return false;
  }

  player.items.splice(i,1);

  return true;
}

async function resolveItem(){

  const player=
    players[currentPlayer];

  const opponent=
    players[1-currentPlayer];

  if(Math.random()<.08){

    if(useBarrier(opponent)){

      updateUI();

      await showInfo(
        "🛡️",
        "バリア！",
        "よこどりをふせいだ！"
      );

      return;
    }

    if(opponent.items.length===0){

      await showInfo(
        "🎁",
        "よこどり！",
        "相手はアイテムを持っていなかった！"
      );

      return;
    }

    const i=
      Math.floor(
        Math.random()*
        opponent.items.length
      );

    const stolen=
      opponent.items.splice(i,1)[0];

    if(player.items.length<3){

      player.items.push(stolen);

      await showInfo(
        "🎁",
        "よこどり！",
        `${stolen.name}をゲット！`
      );

    }

    updateUI();

    return;
  }

  const item=randomItem();

  if(player.items.length>=3){

    await showInfo(
      item.emoji,
      "持ち物いっぱい！",
      `${item.name}が出たけど持てない！`
    );

    return;
  }

  player.items.push(item);

  updateUI();

  await showInfo(
    item.emoji,
    "アイテムゲット！",
    `${item.name}を手に入れた！`
  );

}

const EVENTS=[
  {
    emoji:"🌀",
    title:"ワームホール！",
    text:"2人とも5マスすすむ！",
    move:5
  },
  {
    emoji:"☄️",
    title:"いん石！",
    text:"2人とも3マスもどる！",
    move:-3
  },
  {
    emoji:"🌌",
    title:"宇宙の追い風！",
    text:"2人とも2マスすすむ！",
    move:2
  },
  {
    emoji:"🛰️",
    title:"通信トラブル！",
    text:"2人とも1マスもどる！",
    move:-1
  }
];

async function resolveEvent(){

  const event=
    EVENTS[
      Math.floor(
        Math.random()*
        EVENTS.length
      )
    ];

  await showInfo(
    event.emoji,
    event.title,
    event.text
  );

  for(let i=0;i<2;i++){

    if(event.move>0){

      await moveForward(
        i,
        event.move
      );

    }

    else{

      await moveBackward(
        i,
        Math.abs(event.move)
      );

    }

    if(players[i].node==="goal"){

      goal(i);

      return true;

    }

  }

  return false;
}

function goal(index){

  gameEnded=true;

  const player=
    players[index];

  document.getElementById(
    "goalText"
  ).textContent=
    `${player.piece} ${player.name} ゴール！`;

  document.getElementById(
    "goalOverlay"
  ).style.display="flex";

  updateUI();
}

async function resolveLanding(){

  const player=
    players[currentPlayer];

  const node=
    NODES[player.node];

  await pronunciation(
    currentPlayer
  );

  if(node.type==="goal"){

    goal(currentPlayer);

    return;
  }

  if(node.type==="item"){

    await resolveItem();

  }

  else if(node.type==="event"){

    const ended=
      await resolveEvent();

    if(ended){
      return;
    }

  }

  else if(node.type==="rest"){

    player.skip=true;

    await showInfo(
      "💤",
      "1回休み！",
      "次の番はお休みです。"
    );

  }

  await finishTurn();
}

async function finishTurn(){

  busy=false;

  if(extraTurn){

    extraTurn=false;

    message.textContent=
      "🎲 もう1回！";

    updateUI();

    return;
  }

  currentPlayer=
    1-currentPlayer;

  const player=
    players[currentPlayer];

  if(player.skip){

    player.skip=false;

    busy=true;

    updateUI();

    message.textContent=
      `💤 ${player.name}は1回休み`;

    await wait(800);

    currentPlayer=
      1-currentPlayer;

    busy=false;

  }

  message.textContent=
    "次の人のばん";

  updateUI();
}

async function rollDice(){

  if(busy || gameEnded){
    return;
  }

  busy=true;

  updateUI();

  const player=
    players[currentPlayer];

  let amount;

  if(player.exact!==null){

    amount=player.exact;

    player.exact=null;

    dice.textContent=
      `🎯${amount}`;

  }

  else if(player.double){

    const a=
      Math.floor(
        Math.random()*6
      )+1;

    const b=
      Math.floor(
        Math.random()*6
      )+1;

    amount=a+b;

    player.double=false;

    dice.textContent=
      `${a}+${b}`;

  }

  else{

    amount=
      Math.floor(
        Math.random()*6
      )+1;

    const faces=[
      "⚀","⚁","⚂",
      "⚃","⚄","⚅"
    ];

    dice.textContent=
      faces[amount-1];

  }

  message.textContent=
    `${amount}マスすすむ！`;

  await wait(250);

  await moveForward(
    currentPlayer,
    amount
  );

  await resolveLanding();
}

function chooseExact(){

  return new Promise(resolve=>{

    const holder=
      document.getElementById(
        "exactButtons"
      );

    holder.innerHTML="";

    for(let n=1;n<=6;n++){

      const button=
        document.createElement(
          "button"
        );

      button.className=
        "numberButton";

      button.textContent=n;

      button.onclick=()=>{

        document.getElementById(
          "exactOverlay"
        ).style.display="none";

        resolve(n);

      };

      holder.appendChild(button);

    }

    document.getElementById(
      "exactOverlay"
    ).style.display="flex";

  });

}

async function useItem(index){

  if(busy || gameEnded){
    return;
  }

  const player=
    players[currentPlayer];

  const opponent=
    players[1-currentPlayer];

  const item=
    player.items[index];

  if(!item){
    return;
  }

  player.items.splice(index,1);

  document.getElementById(
    "itemOverlay"
  ).style.display="none";

  updateUI();

  if(item.id==="plus3"){

    busy=true;

    await moveForward(
      currentPlayer,
      3
    );

    await resolveLanding();

    return;
  }

  if(item.id==="double"){

    player.double=true;

    await showInfo(
      "🎲🎲",
      "ダブルサイコロ",
      "次はサイコロ2個！"
    );

  }

  if(item.id==="exact"){

    player.exact=
      await chooseExact();

  }

  if(item.id==="swap"){

    const temp=
      player.node;

    player.node=
      opponent.node;

    opponent.node=
      temp;

    renderPieces();

    await showInfo(
      "🔄",
      "いれかえ！",
      "場所を入れ替えた！"
    );

  }

  if(item.id==="back3"){

    if(useBarrier(opponent)){

      await showInfo(
        "🛡️",
        "バリア！",
        "ふせがれた！"
      );

    }

    else{

      await moveBackward(
        1-currentPlayer,
        3
      );

    }

  }

  if(item.id==="again"){

    extraTurn=true;

    await showInfo(
      "🎲",
      "もう1回！",
      "この番のあともう1回！"
    );

  }

  updateUI();
}

itemButton.onclick=()=>{

  if(busy || gameEnded){
    return;
  }

  const player=
    players[currentPlayer];

  const list=
    document.getElementById(
      "itemList"
    );

  list.innerHTML="";

  player.items.forEach(
    (item,index)=>{

      if(item.id==="barrier"){
        return;
      }

      const button=
        document.createElement(
          "button"
        );

      button.className=
        "mainButton";

      button.style.margin=
        "5px 0";

      button.style.background=
        "#dcecff";

      button.textContent=
        `${item.emoji} ${item.name}`;

      button.onclick=
        ()=>useItem(index);

      list.appendChild(button);

    }
  );

  if(list.children.length===0){
    return;
  }

  document.getElementById(
    "itemOverlay"
  ).style.display="flex";

};

document.getElementById(
  "itemCancel"
).onclick=()=>{

  document.getElementById(
    "itemOverlay"
  ).style.display="none";

};

rollButton.onclick=
  rollDice;

createBoard();

updateUI();
