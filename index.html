<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>発音すごろく 宇宙の旅</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:
    radial-gradient(circle at 15% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 72% 32%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 35% 75%,#fff 0 1px,transparent 2px),
    linear-gradient(#102a61,#030818);
  background-size:120px 120px,170px 170px,210px 210px,auto;
}

button{
  font:inherit;
  touch-action:manipulation;
}

#app{
  max-width:1100px;
  margin:auto;
  padding:12px;
}

h1{
  text-align:center;
  margin:5px 0;
  font-size:28px;
}

.subtitle{
  text-align:center;
  color:#cbd9ff;
  margin-bottom:12px;
}

/* ================================
   プレイヤー
================================ */

.players{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.player{
  background:rgba(255,255,255,.12);
  border-radius:18px;
  padding:10px;
  border:2px solid transparent;
}

.player.active{
  border-color:#ffd84d;
  background:rgba(255,255,255,.20);
}

.player-title{
  font-size:18px;
  font-weight:bold;
}

.inventory{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  min-height:32px;
  margin-top:7px;
}

.item{
  background:white;
  color:#10244a;
  padding:5px 8px;
  border-radius:10px;
  font-size:12px;
  font-weight:bold;
}

/* ================================
   凡例
================================ */

.legend{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin:8px 0;
}

.legend span{
  background:rgba(255,255,255,.12);
  padding:5px 8px;
  border-radius:999px;
  font-size:12px;
}

/* ================================
   盤面
================================ */

.boardOuter{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  background:rgba(0,0,0,.22);
  border-radius:22px;
  padding:8px;
}

#boardStage{
  width:950px;
  height:690px;
  position:relative;
  margin:auto;
  border-radius:20px;
  overflow:hidden;
  background:
    radial-gradient(circle at 8% 82%,#287fd1 0 24px,#1e5798 25px 38px,transparent 39px),
    radial-gradient(circle at 90% 18%,#935ee4 0 23px,#6334a8 24px 34px,transparent 35px),
    radial-gradient(circle at 45% 12%,rgba(255,255,255,.15),transparent 85px),
    radial-gradient(circle at 70% 70%,rgba(177,109,255,.16),transparent 120px);
}

#connections{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1;
}

.pathLine{
  stroke:rgba(190,220,255,.50);
  stroke-width:7;
  stroke-linecap:round;
}

.pathLine.short{
  stroke:#82cfff;
}

.pathLine.long{
  stroke:#8fe79d;
}

.zoneLabel{
  position:absolute;
  z-index:0;
  font-weight:bold;
  opacity:.22;
  font-size:24px;
  pointer-events:none;
}

.space{
  width:62px;
  height:62px;
  border-radius:18px;
  position:absolute;
  transform:translate(-50%,-50%);
  background:#f4f7ff;
  color:#10244a;
  border:2px solid white;
  box-shadow:0 4px 10px rgba(0,0,0,.42);
  z-index:2;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-weight:bold;
}

.spaceNumber{
  position:absolute;
  left:5px;
  top:2px;
  font-size:10px;
  opacity:.58;
}

.spaceIcon{
  font-size:22px;
  line-height:1;
}

.spaceLabel{
  font-size:9px;
  margin-top:3px;
}

.space.normal{
  background:linear-gradient(#fff,#e7edff);
}

.space.itemSpace{
  background:linear-gradient(#d9ffe0,#8dea9f);
}

.space.eventSpace{
  background:linear-gradient(#ffe1f2,#ffacd5);
}

.space.restSpace{
  background:linear-gradient(#ddf2ff,#92d0ff);
}

.space.branchSpace{
  background:linear-gradient(#fff1c5,#ffc86b);
  border:3px solid #ffe28b;
}

.space.startSpace{
  background:linear-gradient(#d7f8ff,#72d7ff);
}

.space.goalSpace{
  background:linear-gradient(#fff8b7,#ffd532);
  width:72px;
  height:72px;
  border-radius:24px;
}

.space.routeShort{
  border-color:#8dd5ff;
}

.space.routeLong{
  border-color:#a3f0ac;
}

/* コマ */

.pieces{
  position:absolute;
  left:-5px;
  right:-5px;
  bottom:-14px;
  display:flex;
  justify-content:center;
  gap:0;
  font-size:27px;
  white-space:nowrap;
  pointer-events:none;
}

.pieceMoving{
  animation:jump .32s ease;
}

@keyframes jump{
  0%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-15px) scale(1.18)}
  100%{transform:translateY(0) scale(1)}
}

/* ================================
   操作
================================ */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.panel{
  background:rgba(255,255,255,.12);
  border-radius:20px;
  padding:12px;
}

#turnText{
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#dice{
  min-height:76px;
  text-align:center;
  font-size:65px;
}

#message{
  min-height:45px;
  padding-top:8px;
  text-align:center;
  line-height:1.5;
}

.mainButton{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  background:#ffd84d;
  color:#14203e;
  font-size:18px;
  font-weight:bold;
}

.mainButton:disabled{
  opacity:.45;
}

/* ================================
   モーダル
================================ */

.overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.83);
  z-index:100;
}

.modal{
  width:min(92vw,500px);
  max-height:90vh;
  overflow:auto;
  background:white;
  color:#13244a;
  border-radius:25px;
  padding:22px;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.bigEmoji{
  font-size:82px;
}

.bigWord{
  margin:8px 0;
  font-size:50px;
  font-weight:bold;
}

.okButton{
  margin-top:14px;
  border:0;
  border-radius:15px;
  padding:13px 25px;
  background:#ffd84d;
  color:#14203e;
  font-size:20px;
  font-weight:bold;
}

/* 分岐 */

.routes{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.routeButton{
  border:0;
  border-radius:18px;
  padding:15px 8px;
  color:#10244a;
  font-weight:bold;
  font-size:18px;
}

.routeButton small{
  display:block;
  margin-top:8px;
  font-size:13px;
  line-height:1.5;
}

.shortRoute{
  background:#bde4ff;
}

.longRoute{
  background:#c7f7cd;
}

/* 数字選択 */

.numberButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.numberButton{
  border:0;
  border-radius:16px;
  padding:15px;
  background:#dcecff;
  color:#10244a;
  font-size:25px;
  font-weight:bold;
}

@media(max-width:650px){
  .players{
    grid-template-columns:1fr;
  }

  .controls{
    grid-template-columns:1fr;
  }

  h1{
    font-size:24px;
  }

  .bigWord{
    font-size:43px;
  }
}
</style>
</head>

</div>

<!-- 発音 -->
<div id="wordOverlay" class="overlay">

/* ==================================================

const players = [
  {

/* ==================================================
   DOM
================================================== */

const boardStage =

const connections =

/* ==================================================
   盤面描画
================================================== */

function nodeIcon(node){

  if(node.type === "start") return "🌍";
  if(node.type === "goal") return "🪐";
  if(node.type === "item") return "🎁";
  if(node.type === "event") return "🌠";
  if(node.type === "rest") return "💤";
  if(node.type === "branch") return "🔀";

  return "⭐";
}

function nodeText(node){

  if(node.type === "start") return "START";
  if(node.type === "goal") return "GOAL";
  if(node.type === "item") return "アイテム";
  if(node.type === "event") return "イベント";
  if(node.type === "rest") return "1回休み";
  if(node.type === "branch") return "分かれ道";

  return "発音";
}

function createBoard(){

  Object.values(NODES).forEach(node=>{

    const el =
      document.createElement("div");

    let className = "space ";

    if(node.type === "item"){
      className += "itemSpace";
    }
    else if(node.type === "event"){
      className += "eventSpace";
    }
    else if(node.type === "rest"){
      className += "restSpace";
    }
    else if(node.type === "branch"){
      className += "branchSpace";
    }
    else if(node.type === "start"){
      className += "startSpace";
    }
    else if(node.type === "goal"){
      className += "goalSpace";
    }
    else{
      className += "normal";
    }

    if(node.route === "short"){
      className += " routeShort";
    }

    if(node.route === "long"){
      className += " routeLong";
    }

    el.className = className;

    el.id =
      `node-${node.id}`;

    el.style.left =
      `${node.x}px`;

    el.style.top =
      `${node.y}px`;

    el.innerHTML = `
      <div class="spaceNumber">
        ${node.label}
      </div>

      <div class="spaceIcon">
        ${nodeIcon(node)}
      </div>

      <div class="spaceLabel">
        ${nodeText(node)}
      </div>

      <div class="pieces"></div>
    `;

    boardStage.appendChild(el);
  });

  drawConnections();
  renderPieces();
}

/* ==================================================
   線
================================================== */

function drawConnections(){

  connections.innerHTML = "";

  Object.values(NODES).forEach(node=>{

    node.next.forEach(nextId=>{

      const next =
        NODES[nextId];

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      line.setAttribute("x1",node.x);
      line.setAttribute("y1",node.y);
      line.setAttribute("x2",next.x);
      line.setAttribute("y2",next.y);

      let className =
        "pathLine";

      if(next.route === "short"){
        className += " short";
      }

      if(next.route === "long"){
        className += " long";
      }

      line.setAttribute(
        "class",
        className
      );

      connections.appendChild(line);
    });
  });
}

/* ==================================================
   コマ
================================================== */

function renderPieces(movingIndex=null){

  document
    .querySelectorAll(".pieces")
    .forEach(el=>{
      el.innerHTML = "";
    });

  players.forEach((player,index)=>{

    const nodeEl =
      document.getElementById(
        `node-${player.node}`
      );

    if(!nodeEl) return;

    const holder =
      nodeEl.querySelector(".pieces");

    const span =
      document.createElement("span");

    span.textContent =
      player.piece;

    if(index === movingIndex){
      span.className =
        "pieceMoving";
    }

    holder.appendChild(span);
  });

  updatePlayerUI();
}

/* ==================================================
   UI
================================================== */

function updatePlayerUI(){

  players.forEach((player,index)=>{

    const card =
      document.getElementById(
        `playerCard${index}`
      );

    card.classList.toggle(
      "active",
      index === currentPlayer
    );

    const node =
      NODES[player.node];

        ? "START"
        : `${node.progress}付近`;

    const inventory =
      document.getElementById(

      );

      inventory.innerHTML = `

        </span>

    }

    player.items.forEach(item=>{

      el.className =
        "item";

      el.textContent =
        `${item.emoji} ${item.name}`;

      inventory.appendChild(el);
    });

    players[currentPlayer];

    player.items.filter(
      item=>item.id !== "barrier"
    );

/* ==================================================
   待機
================================================== */

function wait(ms){
  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );
}

/* ==================================================
   分岐選択
================================================== */

function chooseRoute(){

  return new Promise(resolve=>{

    const overlay =
      document.getElementById(
        "routeOverlay"
      );

    overlay.style.display =
      "flex";

    document.getElementById(
      "shortButton"
    ).onclick = ()=>{

      overlay.style.display =
        "none";

      resolve("short");
    };

    document.getElementById(
      "longButton"
    ).onclick = ()=>{

      overlay.style.display =
        "none";

      resolve("long");
    };
  });
}

async function ensureRouteChoice(
  playerIndex,
  node
){

  const player =
    players[playerIndex];

  if(node.type !== "branch"){
    return null;
  }

  if(player.routes[node.id]){
    return player.routes[node.id];
  }

  const choice =
    await chooseRoute();

  player.routes[node.id] =
    choice;

  return choice;
}

/* ==================================================
   次のマス
================================================== */

async function getNextNode(
  playerIndex
){

  const player =
    players[playerIndex];

  const node =
    NODES[player.node];

  if(node.next.length === 0){
    return null;
  }

  if(node.type === "branch"){

    const choice =
      await ensureRouteChoice(
        playerIndex,
        node
      );

    const wanted =
      node.next.find(id=>
        NODES[id].route === choice
      );

    return wanted || node.next[0];
  }

  return node.next[0];
}

/* ==================================================
   1マスずつ進む
================================================== */

async function moveForward(
  playerIndex,
  steps
){

  for(let i=0;i<steps;i++){

    const player =
      players[playerIndex];

    if(player.node === "goal"){
      break;
    }

    const next =
      await getNextNode(
        playerIndex
      );

    if(!next){
      break;
    }

    player.node =
      next;

    renderPieces(
      playerIndex
    );

    await wait(330);
  }

  return players[playerIndex].node === "goal";
}

/* ==================================================
   ひとつ前のマス
================================================== */

function getPreviousCandidates(nodeId){

  const list = [];

  Object.values(NODES).forEach(node=>{

    if(
      node.next.includes(nodeId)
    ){
      list.push(node.id);
    }
  });

  return list;
}

function selectPrevious(
  player,
  candidates
){

  if(candidates.length <= 1){
    return candidates[0];
  }

  /*
    合流点から戻る時は、
    そのプレイヤーが選んだ道を優先。
  */

  for(
    const branchId
    of ["b10","b20","b36"]
  ){

    const selected =
      player.routes[branchId];

    if(!selected) continue;

    const found =
      candidates.find(id=>
        NODES[id].route === selected
      );

    if(found){
      return found;
    }
  }

  return candidates[0];
}

/* ==================================================
   1マスずつ戻る
================================================== */

async function moveBackward(
  playerIndex,
  steps
){

  const player =
    players[playerIndex];

  for(let i=0;i<steps;i++){

    if(player.node === "start"){
      break;
    }

    const candidates =
      getPreviousCandidates(
        player.node
      );

    if(candidates.length === 0){
      player.node = "start";
    }
    else{
      player.node =
        selectPrevious(
          player,
          candidates
        );
    }

    renderPieces(
      playerIndex
    );

    await wait(280);
  }
}

/* ==================================================
   発音
================================================== */

function pronunciation(
  playerIndex=currentPlayer
){

  return new Promise(resolve=>{

    const player =
      players[playerIndex];

    const node =
      NODES[player.node];

    const progress =
      Math.max(
        1,
        node.progress
      );

    const word =
      ALL_WORDS[
        (progress - 1) %
        ALL_WORDS.length
      ];

    document.getElementById(
      "wordEmoji"
    ).textContent =
      word.emoji;

    document.getElementById(
      "wordText"
    ).textContent =
      word.word;

    const overlay =
      document.getElementById(
        "wordOverlay"
      );

    overlay.style.display =
      "flex";

    document.getElementById(
      "wordOK"
    ).onclick = ()=>{

      overlay.style.display =
        "none";

      resolve();
    };
  });
}

/* ==================================================
   アイテム
================================================== */

const ITEM_POOL = [
  {
    id:"plus3",
    name:"3マスすすむ",
    emoji:"🚀",
    weight:28
  },
  {
    id:"double",
    name:"ダブルサイコロ",
    emoji:"🎲🎲",
    weight:22
  },
  {
    id:"barrier",
    name:"バリア",
    emoji:"🛡️",
    weight:18
  },
  {
    id:"exact",
    name:"ぴったりサイコロ",
    emoji:"🎯",
    weight:14
  },
  {
    id:"swap",
    name:"いれかえ",
    emoji:"🔄",
    weight:8
  },
  {
    id:"back3",
    name:"相手を3マスもどす",
    emoji:"🌀",
    weight:6
  },
  {
    id:"again",
    name:"もう1回",
    emoji:"🎲",
    weight:4
  }
];

function randomItem(){

  const total =
    ITEM_POOL.reduce(
      (sum,item)=>
        sum + item.weight,
      0
    );

  let random =
    Math.random() * total;

  for(
    const item
    of ITEM_POOL
  ){

    random -= item.weight;

    if(random <= 0){
      return {...item};
    }
  }

  return {...ITEM_POOL[0]};
}

/* ==================================================
   バリア
================================================== */

function useBarrier(player){

  const index =
    player.items.findIndex(
      item=>item.id === "barrier"
    );

  if(index === -1){
    return false;
  }

  player.items.splice(
    index,
    1
  );

  updatePlayerUI();

  return true;
}

/* ==================================================
   アイテムマス
================================================== */

async function resolveItemSpace(){

  const player =
    players[currentPlayer];

  const opponent =
    players[
      1-currentPlayer
    ];

  /*
    横どり 8%
  */

  if(Math.random() < .08){

    if(
      useBarrier(opponent)
    ){

      await showInfo(
        "🛡️",
        "バリア！",
        "よこどりをふせいだ！"
      );

      return;
    }

    if(
      opponent.items.length === 0
    ){

      await showInfo(
        "🎁",
        "よこどり！",
        "でも相手はアイテムを持っていなかった！"
      );

      return;
    }

    const index =
      Math.floor(
        Math.random() *
        opponent.items.length
      );

    const stolen =
      opponent.items.splice(
        index,
        1
      )[0];

    if(player.items.length < 3){

      player.items.push(
        stolen
      );

      await showInfo(
        "🎁",
        "よこどり！",
        `${stolen.name}をゲット！`
      );
    }
    else{

      await showInfo(
        "🎁",
        "よこどり！",
        `${stolen.name}を取ったけど、持ち物がいっぱいだった！`
      );
    }

    updatePlayerUI();

    return;
  }

  const item =
    randomItem();

  if(
    player.items.length >= 3
  ){

    await showInfo(
      item.emoji,
      "アイテム！",
      `${item.name}が出た！ でも持ち物が3個なので今回は持てない。`
    );

    return;
  }

  player.items.push(
    item
  );

  updatePlayerUI();

  await showInfo(
    item.emoji,
    "アイテムゲット！",
    `${item.name}を手に入れた！`
  );
}

/* ==================================================
   宇宙イベント
================================================== */

const EVENTS = [
  {
    emoji:"🌀",
    title:"ワームホール！",
    text:"2人とも5マスすすむ！",
    move:5
  },
  {
    emoji:"☄️",
    title:"いん石だ！",
    text:"2人とも3マスもどる！",
    move:-3
  },
  {
    emoji:"🌌",
    title:"宇宙の追い風！",
    text:"2人とも2マスすすむ！",
    move:2
  },
  {
    emoji:"🛰️",
    title:"通信トラブル！",
    text:"2人とも1マスもどる！",
    move:-1
  }
];

async function resolveEventSpace(){

  const event =
    EVENTS[
      Math.floor(
        Math.random() *
        EVENTS.length
      )
    ];

  await showInfo(
    event.emoji,
    event.title,
    event.text
  );

  for(let i=0;i<2;i++){

    if(event.move > 0){

      await moveForward(
        i,
        event.move
      );
    }
    else{

      await moveBackward(
        i,
        Math.abs(event.move)
      );
    }

    if(
      players[i].node === "goal"
    ){

      await goalPlayer(i);

      return true;
    }
  }

  return false;
}

/* ==================================================
   1回休み
================================================== */

async function resolveRestSpace(){

  const player =
    players[currentPlayer];

  player.skip = true;

  await showInfo(
    "💤",
    "1回休み！",
    `${player.name}は次の番を1回休みます。`
  );
}

/* ==================================================
   分岐マス
================================================== */

async function resolveBranchSpace(){

  const player =
    players[currentPlayer];

  const node =
    NODES[player.node];

  if(
    player.routes[node.id]
  ){
    return;
  }

  const choice =
    await chooseRoute();

  player.routes[node.id] =
    choice;

  if(choice === "short"){

    await showInfo(
      "🚀",
      "短い道を選んだ！",
      "近道だけど、途中に💤1回休みがあります。"
    );
  }
  else{

    await showInfo(
      "🎁",
      "長い道を選んだ！",
      "遠回りだけど、途中に🎁アイテムマスがあります。"
    );
  }
}

/* ==================================================
   ゴール
================================================== */

async function goalPlayer(
  playerIndex
){

  if(gameEnded){
    return;
  }

  gameEnded = true;

  const player =
    players[playerIndex];

  document.getElementById(
    "goalText"
  ).textContent =
    `${player.piece} ${player.name} ゴール！`;

  document.getElementById(
    "goalOverlay"
  ).style.display =
    "flex";

  updatePlayerUI();
}

/* ==================================================
   着地処理
================================================== */

async function resolveLanding(){

  const player =
    players[currentPlayer];

  const node =
    NODES[player.node];

  /*
    ゴールでも最後に発音
  */

  await pronunciation(
    currentPlayer
  );

  if(node.type === "goal"){

    await goalPlayer(
      currentPlayer
    );

    return;
  }

  if(node.type === "item"){

    await resolveItemSpace();
  }

  else if(node.type === "event"){

    const ended =
      await resolveEventSpace();

    if(ended){
      return;
    }
  }

  else if(node.type === "rest"){

    await resolveRestSpace();
  }

  else if(node.type === "branch"){

    await resolveBranchSpace();
  }

  if(!gameEnded){
    await finishTurn();
  }
}

/* ==================================================
   ターン終了
================================================== */

async function finishTurn(){

  busy = false;

  if(extraTurn){

    extraTurn = false;

    message.textContent =
      "🎲 もう1回！";

    updatePlayerUI();

    return;
  }

  currentPlayer =
    1-currentPlayer;

  const next =
    players[currentPlayer];

  if(next.skip){

    next.skip = false;

    updatePlayerUI();

    message.textContent =
      `💤 ${next.name}は1回休み！`;

    busy = true;

    await wait(1100);

    currentPlayer =
      1-currentPlayer;

    busy = false;
  }

  message.textContent =
    "次の人のばん！";

  updatePlayerUI();
}

/* ==================================================
   サイコロ
================================================== */

async function rollDice(){

  if(
    busy ||
    gameEnded
  ){
    return;
  }

  busy = true;

  updatePlayerUI();

  const player =
    players[currentPlayer];

  let amount;

  if(
    player.exact !== null
  ){

    amount =
      player.exact;

    player.exact =
      null;

    dice.textContent =
      `🎯${amount}`;
  }

  else if(
    player.double
  ){

    const first =
      Math.floor(
        Math.random()*6
      )+1;

    const second =
      Math.floor(
        Math.random()*6
      )+1;

    amount =
      first+second;

    player.double =
      false;

    dice.textContent =
      `${first}＋${second}`;
  }

  else{

    amount =
      Math.floor(
        Math.random()*6
      )+1;

    const faces = [
      "⚀","⚁","⚂",
      "⚃","⚄","⚅"
    ];

    dice.textContent =
      faces[amount-1];
  }

  message.textContent =
    `${amount}マスすすむ！`;

  await wait(350);

  await moveForward(
    currentPlayer,
    amount
  );

  await resolveLanding();
}

/* ==================================================
   ぴったりサイコロ
================================================== */

function chooseExactNumber(){

  return new Promise(resolve=>{

    const overlay =
      document.getElementById(
        "exactOverlay"
      );

    const holder =
      document.getElementById(
        "exactButtons"
      );

    holder.innerHTML = "";

    for(let n=1;n<=6;n++){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "numberButton";

      button.textContent = n;

      button.onclick = ()=>{

        overlay.style.display =
          "none";

        resolve(n);
      };

      holder.appendChild(
        button
      );
    }

    overlay.style.display =
      "flex";
  });
}

/* ==================================================
   アイテム使用
================================================== */

async function useItem(index){

  if(
    busy ||
    gameEnded
  ){
    return;
  }

  const player =
    players[currentPlayer];

  const opponent =
    players[
      1-currentPlayer
    ];

  const item =
    player.items[index];

  if(!item){
    return;
  }

  player.items.splice(
    index,
    1
  );

  document.getElementById(
    "itemOverlay"
  ).style.display =
    "none";

  updatePlayerUI();

  /* ----------------
     3マスすすむ
  ---------------- */

  if(item.id === "plus3"){

    busy = true;

    updatePlayerUI();

    await showInfo(
      "🚀",
      "3マスすすむ！",
      "3マス前へ進みます！"
    );

    await moveForward(
      currentPlayer,
      3
    );

    await resolveLanding();

    return;
  }

  /* ----------------
     ダブルサイコロ
  ---------------- */

  if(item.id === "double"){

    player.double = true;

    await showInfo(
      "🎲🎲",
      "ダブルサイコロ",
      "次にサイコロを2個ふります！"
    );
  }

  /* ----------------
     ぴったり
  ---------------- */

  if(item.id === "exact"){

    const number =
      await chooseExactNumber();

    player.exact =
      number;

    await showInfo(
      "🎯",
      "ぴったりサイコロ",
      `次は${number}マス進みます！`
    );
  }

  /* ----------------
     いれかえ
  ---------------- */

  if(item.id === "swap"){

    const temp =
      player.node;

    player.node =
      opponent.node;

    opponent.node =
      temp;

    renderPieces();

    await showInfo(
      "🔄",
      "いれかえ！",
      "相手と場所をいれかえた！"
    );
  }

  /* ----------------
     相手を3マスもどす
  ---------------- */

  if(item.id === "back3"){

    if(
      useBarrier(opponent)
    ){

      await showInfo(
        "🛡️",
        "バリア！",
        "相手のバリアでふせがれた！"
      );
    }

    else{

      await showInfo(
        "🌀",
        "3マスもどす！",
        "相手を3マスもどします！"
      );

      await moveBackward(
        1-currentPlayer,
        3
      );
    }
  }

  /* ----------------
     もう1回
  ---------------- */

  if(item.id === "again"){

    extraTurn = true;

    await showInfo(
      "🎲",
      "もう1回！",
      "この番のあと、もう1回できます！"
    );
  }

  updatePlayerUI();
}
