<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>発音すごろく</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      background:
        radial-gradient(
          circle at 30% 20%,
          #26336f 0%,
          #11183d 35%,
          #070b21 100%
        );

      color: white;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }


    /* =====================================================
       星空
    ===================================================== */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      background-image:
        radial-gradient(circle, rgba(255,255,255,.95) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.65) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1px);

      background-size:
        55px 55px,
        85px 85px,
        120px 120px;

      background-position:
        0 0,
        25px 40px,
        60px 10px;

      opacity: .55;
    }


    /* =====================================================
       縦画面
    ===================================================== */

    #rotateMessage {
      position: fixed;
      inset: 0;

      z-index: 9999;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #080d27;

      text-align: center;
    }

    #rotateMessage .rotateBox {
      background: rgba(255,255,255,.1);

      border: 2px solid rgba(255,255,255,.3);
      border-radius: 24px;

      padding: 28px;

      font-size: 22px;
      font-weight: 900;
    }

    @media (orientation: portrait) {

      #rotateMessage {
        display: flex;
      }

    }


    /* =====================================================
       音選択
    ===================================================== */

    #soundScreen {
      position: fixed;
      inset: 0;

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .soundPanel {
      width: min(680px, 92vw);

      padding: 28px;

      border-radius: 28px;

      background:
        linear-gradient(
          180deg,
          rgba(33,47,105,.97),
          rgba(16,23,64,.97)
        );

      border: 2px solid rgba(255,255,255,.22);

      box-shadow:
        0 20px 60px rgba(0,0,0,.5);

      text-align: center;
    }

    .soundTitle {
      margin-bottom: 6px;

      font-size: clamp(26px, 4vw, 42px);
      font-weight: 1000;
    }

    .soundSubtitle {
      margin-bottom: 24px;

      opacity: .8;

      font-size: 15px;
      font-weight: 700;
    }

    #soundButtons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 14px;
    }

    .soundButton {
      min-width: 110px;
      min-height: 80px;

      border: 0;
      border-radius: 22px;

      background:
        linear-gradient(
          180deg,
          #fff,
          #dce8ff
        );

      color: #17255f;

      font-size: 34px;
      font-weight: 1000;

      box-shadow:
        0 7px 0 #9eb4e3,
        0 14px 26px rgba(0,0,0,.28);
    }

    .soundButton:active {
      transform: translateY(5px);

      box-shadow:
        0 2px 0 #9eb4e3;
    }


    /* =====================================================
       アプリ全体
    ===================================================== */

    #app {
      position: relative;

      z-index: 2;

      display: none;

      width: 100vw;
      height: 100vh;

      padding: 6px;
    }


    /* =====================================================
       上部
    ===================================================== */

    .topBar {
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 8px;

      padding: 0 8px;

      background: rgba(8,14,47,.86);

      border: 1px solid rgba(255,255,255,.15);
      border-radius: 14px;

      box-shadow:
        0 5px 16px rgba(0,0,0,.25);
    }

    .gameTitle {
      font-size: clamp(16px, 2.2vw, 24px);
      font-weight: 1000;

      white-space: nowrap;
    }

    .targetBadge {
      padding: 6px 12px;

      border-radius: 999px;

      background: rgba(255,255,255,.16);

      font-size: 14px;
      font-weight: 900;
    }

    #changeSoundButton {
      border: 0;

      padding: 7px 12px;

      border-radius: 12px;

      background: rgba(255,255,255,.15);

      color: white;

      font-size: 12px;
      font-weight: 900;
    }


    /* =====================================================
       盤面＋右UI
    ===================================================== */

    .gameArea {
      height: calc(100vh - 56px);

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        clamp(190px, 23vw, 255px);

      gap: 6px;

      margin-top: 6px;
    }


    /* =====================================================
       盤面
    ===================================================== */

    #boardWrap {
      position: relative;

      min-width: 0;
      min-height: 0;

      overflow: hidden;

      border-radius: 20px;

      border: 2px solid rgba(255,255,255,.18);

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(85,102,191,.18),
          transparent 45%
        ),
        linear-gradient(
          180deg,
          rgba(12,19,58,.96),
          rgba(5,9,31,.96)
        );

      box-shadow:
        inset 0 0 50px rgba(0,0,0,.35);
    }


    /*
       ★今回の変更部分
       マップ全体を少し上へ移動
    */

    #board {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      transform: translateY(-4%);
    }


    /* =====================================================
       背景オブジェクト
    ===================================================== */

    .spaceDecoration {
      position: absolute;

      pointer-events: none;
      user-select: none;

      opacity: .8;

      filter:
        drop-shadow(
          0 3px 4px rgba(0,0,0,.4)
        );
    }

    .earth {
      left: 2%;
      bottom: 1%;

      font-size: clamp(35px, 5vw, 68px);
    }

    .moon {
      right: 3%;
      bottom: 16%;

      font-size: clamp(26px, 4vw, 52px);
    }

    .planet1 {
      right: 4%;
      top: 4%;

      font-size: clamp(30px, 4.5vw, 60px);
    }

    .planet2 {
      left: 25%;
      top: 28%;

      font-size: clamp(26px, 4vw, 50px);
    }

    .goalPlanet {
      left: 34%;
      top: 36%;

      font-size: clamp(34px, 5vw, 68px);
    }


    /* =====================================================
       道
    ===================================================== */

    #linkLayer {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: visible;

      pointer-events: none;

      z-index: 1;
    }

    .pathLine {
      stroke: rgba(175,209,255,.65);

      stroke-width: .75;

      stroke-linecap: round;
    }


    /* =====================================================
       マス
    ===================================================== */

    .space {
      position: absolute;

      z-index: 3;

      width: clamp(27px, 3.45vw, 43px);
      height: clamp(27px, 3.45vw, 43px);

      transform: translate(-50%, -50%);

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      border: 2px solid rgba(255,255,255,.75);

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.96),
          rgba(201,221,255,.92)
        );

      color: #15245c;

      font-size: clamp(8px, 1vw, 12px);
      font-weight: 1000;

      box-shadow:
        0 4px 8px rgba(0,0,0,.4);

      user-select: none;
    }

    .space.item {
      background:
        linear-gradient(
          180deg,
          #fff4b7,
          #ffcf5a
        );

      border-color: #fff2a1;
    }

    .space.event {
      background:
        linear-gradient(
          180deg,
          #d7c4ff,
          #8f7aff
        );

      border-color: #efe8ff;
    }

    .space.rest {
      background:
        linear-gradient(
          180deg,
          #caf6ff,
          #82d7ea
        );
    }

    .space.start {
      background:
        linear-gradient(
          180deg,
          #c6ffd7,
          #65dc8a
        );

      color: #074b22;

      font-size: 8px;
    }

    .space.goal {
      width: clamp(37px, 4.5vw, 56px);
      height: clamp(37px, 4.5vw, 56px);

      border-radius: 50%;

      background:
        linear-gradient(
          180deg,
          #ffe596,
          #ff9d3f
        );

      color: #612900;

      font-size: 9px;

      box-shadow:
        0 0 25px rgba(255,193,74,.8);
    }


    /* =====================================================
       コマ
    ===================================================== */

    .pieces {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 6;

      display: flex;

      pointer-events: none;
    }

    .piece {
      font-size: clamp(16px, 2.3vw, 28px);

      filter:
        drop-shadow(
          0 3px 2px rgba(0,0,0,.55)
        );

      line-height: 1;
    }

    .piece + .piece {
      margin-left: -7px;
    }


    /* =====================================================
       右UI
    ===================================================== */

    .sidePanel {
      min-height: 0;

      display: flex;
      flex-direction: column;

      gap: 5px;
    }

    .panelBox {
      border-radius: 16px;

      border: 1px solid rgba(255,255,255,.16);

      background: rgba(15,23,65,.92);

      box-shadow:
        0 5px 16px rgba(0,0,0,.25);

      padding: 7px;
    }


    /* =====================================================
       プレイヤー
    ===================================================== */

    .playersBox {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 5px;
    }

    .playerCard {
      min-width: 0;

      padding: 6px;

      border-radius: 13px;

      background:
        rgba(255,255,255,.08);

      border:
        2px solid transparent;

      text-align: center;
    }

    .playerCard.active {
      border-color: #ffe566;

      background:
        rgba(255,229,102,.13);

      box-shadow:
        0 0 14px rgba(255,229,102,.25);
    }

    .playerIcon {
      font-size: 24px;
    }

    .playerName {
      font-size: 11px;
      font-weight: 1000;
    }

    .playerPosition {
      margin-top: 2px;

      font-size: 9px;

      opacity: .8;
    }


    /* =====================================================
       メッセージ
    ===================================================== */

    #messageBox {
      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 7px;

      border-radius: 14px;

      background:
        rgba(255,255,255,.08);

      text-align: center;

      font-size:
        clamp(11px, 1.35vw, 15px);

      font-weight: 900;
    }


    /* =====================================================
       サイコロ
    ===================================================== */

    .dicePanel {
      text-align: center;
    }

    #diceDisplay {
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      font-size:
        clamp(42px, 6vw, 66px);

      line-height: 1;
    }

    .diceSingle {
      display: inline-block;

      filter:
        drop-shadow(
          0 5px 5px rgba(0,0,0,.45)
        );
    }


    /*
       サイコロ回転
    */

    .diceRolling {
      animation:
        diceRoll .16s linear infinite;
    }

    @keyframes diceRoll {

      0% {
        transform:
          rotate(0deg)
          scale(1);
      }

      25% {
        transform:
          rotate(90deg)
          scale(1.12);
      }

      50% {
        transform:
          rotate(180deg)
          scale(.94);
      }

      75% {
        transform:
          rotate(270deg)
          scale(1.12);
      }

      100% {
        transform:
          rotate(360deg)
          scale(1);
      }

    }


    #rollButton {
      width: 100%;

      border: 0;
      border-radius: 15px;

      padding: 10px 6px;

      background:
        linear-gradient(
          180deg,
          #ffe476,
          #ffb633
        );

      color: #4c2a00;

      font-size:
        clamp(15px, 2vw, 20px);

      font-weight: 1000;

      box-shadow:
        0 5px 0 #c67815;
    }

    #rollButton:active:not(:disabled) {
      transform:
        translateY(4px);

      box-shadow:
        0 1px 0 #c67815;
    }

    #rollButton:disabled {
      opacity: .45;

      cursor: default;

      box-shadow: none;
    }


    /* =====================================================
       アイテム
    ===================================================== */

    .inventoryTitle {
      margin-bottom: 5px;

      font-size: 11px;
      font-weight: 1000;
    }

    #inventory {
      display: grid;

      grid-template-columns: 1fr;

      gap: 4px;
    }

    .itemButton {
      width: 100%;

      border:
        1px solid rgba(255,255,255,.18);

      border-radius: 10px;

      padding: 5px 6px;

      background:
        rgba(255,255,255,.1);

      color: white;

      text-align: left;

      font-size: 10px;
      font-weight: 900;
    }

    .itemButton:disabled {
      opacity: .4;
    }

    .inventoryEmpty {
      padding: 6px;

      opacity: .55;

      font-size: 10px;

      text-align: center;
    }


    /* =====================================================
       モーダル
    ===================================================== */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 5000;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 16px;

      background:
        rgba(2,5,20,.74);
    }

    .modal.show {
      display: flex;
    }

    .modalCard {
      width:
        min(500px, 90vw);

      border:
        2px solid rgba(255,255,255,.2);

      border-radius: 26px;

      padding: 22px;

      background:
        linear-gradient(
          180deg,
          #263474,
          #111944
        );

      box-shadow:
        0 20px 60px rgba(0,0,0,.6);

      text-align: center;
    }

    .modalTitle {
      font-size:
        clamp(20px, 3vw, 30px);

      font-weight: 1000;
    }

    .practicePicture {
      margin:
        10px 0 2px;

      font-size:
        clamp(52px, 9vw, 86px);

      line-height: 1.1;
    }

    .practiceWord {
      margin-top: 6px;

      font-size:
        clamp(30px, 6vw, 54px);

      font-weight: 1000;
    }

    .practiceInstruction {
      margin:
        8px 0 16px;

      font-size: 18px;
      font-weight: 900;
    }

    .bigOKButton {
      width: 100%;

      border: 0;
      border-radius: 18px;

      padding: 14px;

      background:
        linear-gradient(
          180deg,
          #8ff5ad,
          #45c66d
        );

      color: #063d19;

      font-size: 24px;
      font-weight: 1000;
    }

    .infoText {
      margin:
        18px 0;

      font-size: 18px;

      line-height: 1.6;

      font-weight: 900;
    }

    .modalButton {
      border: 0;
      border-radius: 14px;

      padding:
        11px 18px;

      background: white;

      color: #17245a;

      font-size: 16px;
      font-weight: 1000;
    }


    /* =====================================================
       ぴったりサイコロ
    ===================================================== */

    .exactButtons {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;

      margin-top: 18px;
    }

    .exactButton {
      border: 0;
      border-radius: 15px;

      padding:
        13px 0;

      background: white;

      color: #182861;

      font-size: 25px;
      font-weight: 1000;
    }


    /* =====================================================
       小さい横画面
    ===================================================== */

    @media
      (orientation: landscape)
      and (max-height: 520px) {

      #app {
        padding: 4px;
      }

      .topBar {
        height: 36px;
      }

      .gameArea {
        height:
          calc(100vh - 44px);

        margin-top: 4px;

        grid-template-columns:
          minmax(0, 1fr)
          215px;

        gap: 4px;
      }

      .sidePanel {
        gap: 3px;
      }

      .panelBox {
        padding: 5px;

        border-radius: 12px;
      }

      .space {
        width:
          clamp(24px, 3vw, 36px);

        height:
          clamp(24px, 3vw, 36px);

        border-radius: 9px;
      }

      .space.goal {
        width:
          clamp(32px, 4vw, 45px);

        height:
          clamp(32px, 4vw, 45px);
      }

      #diceDisplay {
        min-height: 45px;

        font-size: 45px;
      }

      #rollButton {
        padding:
          7px 5px;

        font-size: 15px;
      }

      #messageBox {
        min-height: 37px;

        padding: 4px;

        font-size: 11px;
      }

      .playerIcon {
        font-size: 19px;
      }

      .itemButton {
        padding:
          3px 5px;

        font-size: 9px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       縦画面メッセージ
  ====================================================== -->

  <div id="rotateMessage">

    <div class="rotateBox">

      📱 ↻
      <br><br>

      よこむきにして
      <br>
      あそんでね！

    </div>

  </div>


  <!-- =====================================================
       音選択
  ====================================================== -->

  <div id="soundScreen">

    <div class="soundPanel">

      <div class="soundTitle">
        🚀 発音すごろく
      </div>

      <div class="soundSubtitle">
        どの音であそぶ？
      </div>

      <div id="soundButtons"></div>

    </div>

  </div>


  <!-- =====================================================
       ゲーム
  ====================================================== -->

  <div id="app">

    <div class="topBar">

      <div class="gameTitle">
        🚀 発音すごろく
      </div>

      <div
        id="targetBadge"
        class="targetBadge"
      >
        ターゲット：-
      </div>

      <button id="changeSoundButton">
        音をかえる
      </button>

    </div>


    <div class="gameArea">


      <!-- マップ -->

      <div id="boardWrap">

        <div class="spaceDecoration earth">
          🌍
        </div>

        <div class="spaceDecoration moon">
          🌕
        </div>

        <div class="spaceDecoration planet1">
          🪐
        </div>

        <div class="spaceDecoration planet2">
          🔴
        </div>

        <div class="spaceDecoration goalPlanet">
          🌌
        </div>


        <div id="board">

          <svg
            id="linkLayer"
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
          ></svg>

        </div>

      </div>


      <!-- 右UI -->

      <div class="sidePanel">


        <div class="panelBox playersBox">

          <div
            id="playerCard0"
            class="playerCard active"
          >

            <div class="playerIcon">
              🚀
            </div>

            <div class="playerName">
              チャレンジャー
            </div>

            <div
              id="playerPosition0"
              class="playerPosition"
            >
              START
            </div>

          </div>


          <div
            id="playerCard1"
            class="playerCard"
          >

            <div class="playerIcon">
              🛸
            </div>

            <div class="playerName">
              先生
            </div>

            <div
              id="playerPosition1"
              class="playerPosition"
            >
              START
            </div>

          </div>

        </div>


        <div
          id="messageBox"
          class="panelBox"
        >
          🚀 チャレンジャーのばん！
        </div>


        <div class="panelBox dicePanel">

          <div id="diceDisplay">

            <span
              id="dice1"
              class="diceSingle"
            >
              ⚄
            </span>

          </div>

          <button id="rollButton">
            🎲 サイコロをふる
          </button>

        </div>


        <div class="panelBox">

          <div
            id="inventoryTitle"
            class="inventoryTitle"
          >
            🎒 チャレンジャーのアイテム
          </div>

          <div id="inventory"></div>

        </div>


      </div>

    </div>

  </div>


  <!-- =====================================================
       発音モーダル
  ====================================================== -->

  <div
    id="practiceModal"
    class="modal"
  >

    <div class="modalCard">

      <div class="modalTitle">
        🗣️ 発音チャレンジ！
      </div>

      <div
        id="practicePicture"
        class="practicePicture"
      >
        🗣️
      </div>

      <div
        id="practiceWord"
        class="practiceWord"
      >
        すいか
      </div>

      <div class="practiceInstruction">
        3かいいってみよう！
      </div>

      <button
        id="practiceOK"
        class="bigOKButton"
      >
        OK！
      </button>

    </div>

  </div>


  <!-- =====================================================
       情報モーダル
  ====================================================== -->

  <div
    id="infoModal"
    class="modal"
  >

    <div class="modalCard">

      <div
        id="infoTitle"
        class="modalTitle"
      >
        お知らせ
      </div>

      <div
        id="infoText"
        class="infoText"
      ></div>

      <button
        id="infoOK"
        class="modalButton"
      >
        OK
      </button>

    </div>

  </div>


  <!-- =====================================================
       ぴったりサイコロ
  ====================================================== -->

  <div
    id="exactModal"
    class="modal"
  >

    <div class="modalCard">

      <div class="modalTitle">
        🎯 いくつ進む？
      </div>

      <div class="exactButtons">

        <button class="exactButton" data-value="1">
          1
        </button>

        <button class="exactButton" data-value="2">
          2
        </button>

        <button class="exactButton" data-value="3">
          3
        </button>

        <button class="exactButton" data-value="4">
          4
        </button>

        <button class="exactButton" data-value="5">
          5
        </button>

        <button class="exactButton" data-value="6">
          6
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       データ
  ====================================================== -->

  <script src="./sounds.js"></script>
  <script src="./map.js"></script>


  <script>

    /* =====================================================
       基本
    ===================================================== */

    function createSoundButtons() {

      soundButtons.innerHTML = "";


      if (
        typeof SOUND_LIST === "undefined" ||
        !Array.isArray(SOUND_LIST) ||
        SOUND_LIST.length === 0
      ) {

        soundButtons.textContent =
          "sounds.js が読み込めません";

        return;
      }


      SOUND_LIST.forEach(
        sound => {

          const button =
            document.createElement("button");


          button.className =
            "soundButton";


          button.textContent =
            sound.label;


          button.addEventListener(
            "click",
            () => {

              loadSound(sound);

            }
          );


          soundButtons.appendChild(
            button
          );

        }
      );

    }


    function loadSound(sound) {

      currentSound =
        sound;


      window.WORD_DATA =
        null;


      const oldScript =
        document.getElementById(
          "wordDataScript"
        );


      if (oldScript) {

        oldScript.remove();

      }


      const script =
        document.createElement("script");


      script.id =
        "wordDataScript";


      script.src =
        sound.file +
        "?v=" +
        Date.now();


      script.onload =
        () => {

          if (!window.WORD_DATA) {

            alert(
              sound.label +
              " のWordデータが見つかりません"
            );

            return;

          }


          const data =
            window.WORD_DATA;


          ALL_WORDS = [

            ...(data.start || []),

            ...(data.end || []),

            ...(data.middle || [])

          ];


          if (
            ALL_WORDS.length === 0
          ) {

            alert(
              "Wordが入っていません"
            );

            return;

          }


          startGame();

        };


      script.onerror =
        () => {

          alert(
            sound.file +
            " を読み込めません"
          );

        };


      document.body.appendChild(
        script
      );

    }

    function createBoard() {

      board
        .querySelectorAll(".space")
        .forEach(
          element =>
            element.remove()
        );


      linkLayer.innerHTML =
        "";


      MAP_DATA.nodes.forEach(
        node => {

          const space =
            document.createElement("div");


          space.className =
            "space " +
            (node.type || "normal");


          space.id =
            "space-" +
            node.id;


          space.style.left =
            node.x + "%";


          space.style.top =
            node.y + "%";


          if (
            node.type === "item"
          ) {

            space.textContent =
              "🎁";

          }

          else if (
            node.type === "event"
          ) {

            space.textContent =
              "🌠";

          }

          else if (
            node.type === "rest"
          ) {

            space.textContent =
              "💤";

          }

          else {

            space.textContent =
              node.label;

          }


          const pieces =
            document.createElement(
              "div"
            );


          pieces.className =
            "pieces";


          pieces.id =
            "pieces-" +
            node.id;


          space.appendChild(
            pieces
          );


          board.appendChild(
            space
          );

        }
      );


      drawConnections();

      renderPieces();

    }


    /* =====================================================

    ===================================================== */

    function drawConnections() {

      linkLayer.innerHTML =
        "";


      MAP_DATA.links.forEach(
        link => {

          const from =
            getNode(
              link[0]
            );


          const to =
            getNode(
              link[1]
            );


          if (
            !from ||
            !to
          ) {

            return;

          }


          const line =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line"
            );


          line.setAttribute(
            "x1",
            from.x
          );

          line.setAttribute(
            "y1",
            from.y
          );

          line.setAttribute(
            "x2",
            to.x
          );

          line.setAttribute(
            "y2",
            to.y
          );

          line.setAttribute(
            "class",
            "pathLine"
          );


          linkLayer.appendChild(
            line
          );

        }
      );

    }

    /*

    async function animateOneDice() {

      diceDisplay.innerHTML =
        `
          <span
            id="rollingDice1"
            class="diceSingle diceRolling"
          >
            ⚀
          </span>
        `;


      const dice =
        document.getElementById(
          "rollingDice1"
        );


      const interval =
        setInterval(
          () => {

            const temporary =
              Math.floor(
                Math.random() * 6
              ) + 1;


            dice.textContent =
              getDiceFace(
                temporary
              );

          },
          80
        );


      await wait(
        1200
      );


      clearInterval(
        interval
      );


      const result =
        Math.floor(
          Math.random() * 6
        ) + 1;


      dice.classList.remove(
        "diceRolling"
      );


      dice.textContent =
        getDiceFace(
          result
        );


      /*
         結果を少し見せる
      */

      await wait(
        500
      );


      return result;

    }

    /* =====================================================
       前進
    ===================================================== */

    function getNextNode(nodeId) {

      const link =
        MAP_DATA.links.find(
          item =>
            item[0] === nodeId
        );


      if (!link) {

        return null;

      }


      return link[1];

    }


    async function moveForward(
      player,
      steps,
      doLanding
    ) {

      for (
        let i = 0;
        i < steps;
        i++
      ) {

        const next =
          getNextNode(
            player.node
          );


        if (!next) {

          break;

        }


        player.node =
          next;


        player.history.push(
          next
        );


        renderPieces();

        updatePositionsOnly();


        /*
           1マスずつ動く
        */

        await wait(
          300
        );


        if (
          next === "goal"
        ) {

          await goalReached(
            player
          );


          return;

        }

      }


      if (
        doLanding
      ) {

        await landing(
          player
        );

      }

      else {

        moving =
          false;


        updateUI();

      }

    }


    /* =====================================================
       後退
    ===================================================== */

    async function moveBackward(
      player,
      steps
    ) {

      for (
        let i = 0;
        i < steps;
        i++
      ) {

        if (
          player.history.length <= 1
        ) {

          break;

        }


        player.history.pop();


        player.node =
          player.history[
            player.history.length - 1
          ];


        renderPieces();

        updatePositionsOnly();


        await wait(
          300
        );

      }

    }


    /* =====================================================
       着地
    ===================================================== */

    async function landing(player) {

      const node =
        getNode(
          player.node
        );


      /*
         全マスで発音
      */

      await practice();


      if (
        gameEnded
      ) {

        return;

      }


      if (!node) {

        finishTurn();

        return;

      }


      if (
        node.type === "item"
      ) {

        await itemLanding(
          player
        );

      }

      else if (
        node.type === "event"
      ) {

        await eventLanding();

      }

      else if (
        node.type === "rest"
      ) {

        player.skip =
          true;


        await showInfo(
          "💤 1回休み",
          player.name +
          "は次のばんを1回休み！"
        );

      }


      finishTurn();

    }

    /* =====================================================

    ===================================================== */

    async function itemLanding(player) {

      /*
         8%で横どり
      */

      if (
        Math.random() < 0.08
      ) {

        await stealItem(
          player
        );


        return;

      }


      const item =
        chooseWeightedItem();


      if (
        player.items.length >= 3
      ) {

        await showInfo(
          "🎒 アイテムいっぱい",
          "アイテムは3こまで！"
        );


        return;

      }


      player.items.push(
        { ...item }
      );


      await showInfo(
        "🎁 アイテムゲット！",
        item.icon +
        " " +
        item.name
      );

    }


    function chooseWeightedItem() {

      const total =
        ITEM_POOL.reduce(
          (sum, item) =>
            sum + item.weight,
          0
        );


      let random =
        Math.random() *
        total;


      for (
        const item of ITEM_POOL
      ) {

        random -=
          item.weight;


        if (
          random <= 0
        ) {

          return item;

        }

      }


      return ITEM_POOL[0];

    }


    /* =====================================================
       横どり
    ===================================================== */

    async function stealItem(player) {

      const opponent =
        players[
          currentPlayer === 0
            ? 1
            : 0
        ];


      const barrierIndex =
        opponent.items.findIndex(
          item =>
            item.id === "barrier"
        );


      if (
        barrierIndex >= 0
      ) {

        opponent.items.splice(
          barrierIndex,
          1
        );


        await showInfo(
          "🛡️ バリア！",
          opponent.name +
          "のバリアが横どりを防いだ！"
        );


        return;

      }


      if (
        opponent.items.length === 0
      ) {

        await showInfo(
          "🎁 よこどり！",
          "でも相手はアイテムを持っていなかった！"
        );


        return;

      }


      if (
        player.items.length >= 3
      ) {

        await showInfo(
          "🎁 よこどり！",
          "でもアイテムがいっぱい！"
        );


        return;

      }


      const index =
        Math.floor(
          Math.random() *
          opponent.items.length
        );


      const stolen =
        opponent.items.splice(
          index,
          1
        )[0];


      player.items.push(
        stolen
      );


      await showInfo(
        "🎁 よこどり！",
        stolen.icon +
        " " +
        stolen.name +
        " をゲット！"
      );

    }


    /* =====================================================
       アイテム使用
    ===================================================== */

    async function useItem(index) {

      if (
        moving ||
        gameEnded
      ) {

        return;

      }


      const player =
        players[currentPlayer];


      const item =
        player.items[index];


      if (!item) {

        return;

      }


      /*
         バリアは自動
      */

      if (
        item.id === "barrier"
      ) {

        await showInfo(
          "🛡️ バリア",
          "攻撃されたとき自動で使います"
        );


        return;

      }


      player.items.splice(
        index,
        1
      );


      moving =
        true;


      rollButton.disabled =
        true;


      renderInventory();


      /*
         3マス進む
      */

      if (
        item.id === "plus3"
      ) {

        messageBox.textContent =
          "🚀 3マスすすむ！";


        await moveForward(
          player,
          3,
          true
        );


        return;

      }


      /*
         ダブル
      */

      if (
        item.id === "double"
      ) {

        player.double =
          true;


        moving =
          false;


        messageBox.textContent =
          "🎲🎲 次はダブルサイコロ！";


        updateUI();


        return;

      }


      /*
         ぴったり
      */

      if (
        item.id === "exact"
      ) {

        player.exact =
          true;


        moving =
          false;


        messageBox.textContent =
          "🎯 次は好きな目をえらべる！";


        updateUI();


        return;

      }


      /*
         入れ替え
      */

      if (
        item.id === "swap"
      ) {

        swapPlayers();


        await showInfo(
          "🔄 いれかえ！",
          "ふたりの場所が入れ替わった！"
        );


        finishTurn();


        return;

      }


      /*
         相手を3マス戻す
      */

      if (
        item.id === "back3"
      ) {

        const opponent =
          players[
            currentPlayer === 0
              ? 1
              : 0
          ];


        const barrierIndex =
          opponent.items.findIndex(
            item =>
              item.id === "barrier"
          );


        if (
          barrierIndex >= 0
        ) {

          opponent.items.splice(
            barrierIndex,
            1
          );


          await showInfo(
            "🛡️ バリア！",
            opponent.name +
            "のバリアが攻撃を防いだ！"
          );

        }

        else {

          messageBox.textContent =
            "🌀 " +
            opponent.name +
            "が3マスもどる！";


          await moveBackward(
            opponent,
            3
          );

        }


        finishTurn();


        return;

      }


      /*
         もう1回
      */

      if (
        item.id === "again"
      ) {

        extraTurn =
          true;


        moving =
          false;


        messageBox.textContent =
          "🎲 もう1回サイコロをふれる！";


        updateUI();


        return;

      }


      moving =
        false;


      updateUI();

    }


    /* =====================================================
       入れ替え
    ===================================================== */

    function swapPlayers() {

      const aNode =
        players[0].node;


      const aHistory =
        [...players[0].history];


      players[0].node =
        players[1].node;


      players[0].history =
        [...players[1].history];


      players[1].node =
        aNode;


      players[1].history =
        aHistory;


      renderPieces();

      updatePositionsOnly();

    }


    /* =====================================================
       宇宙イベント
    ===================================================== */

    async function eventLanding() {

      const events = [

        {
          title:
            "🌀 ワームホール！",

          text:
            "ふたりとも5マスすすむ！",

          amount:
            5
        },

        {
          title:
            "☄️ いん石！",

          text:
            "ふたりとも3マスもどる！",

          amount:
            -3
        },

        {
          title:
            "🌟 スーパースター！",

          text:
            "ふたりとも2マスすすむ！",

          amount:
            2
        },

        {
          title:
            "🌑 宇宙のゆらぎ！",

          text:
            "ふたりとも1マスもどる！",

          amount:
            -1
        }

      ];


      const event =
        events[
          Math.floor(
            Math.random() *
            events.length
          )
        ];


      await showInfo(
        event.title,
        event.text
      );


      if (
        event.amount > 0
      ) {

        for (
          const player of players
        ) {

          await moveWithoutLanding(
            player,
            event.amount
          );

        }

      }

      else {

        for (
          const player of players
        ) {

          await moveBackward(
            player,
            Math.abs(
              event.amount
            )
          );

        }

      }

    }


    async function moveWithoutLanding(
      player,
      steps
    ) {

      for (
        let i = 0;
        i < steps;
        i++
      ) {

        const next =
          getNextNode(
            player.node
          );


        if (!next) {

          break;

        }


        player.node =
          next;


        player.history.push(
          next
        );


        renderPieces();

        updatePositionsOnly();


        await wait(
          230
        );


        if (
          player.node === "goal"
        ) {

          await goalReached(
            player
          );


          return;

        }

      }

    }


    /* =====================================================
       ターン終了
    ===================================================== */

    function finishTurn() {

      if (
        gameEnded
      ) {

        return;

      }


      moving =
        false;


      if (
        extraTurn
      ) {

        extraTurn =
          false;


        messageBox.textContent =
          players[currentPlayer].name +
          "はもう1回！";


        updateUI();


        return;

      }


      currentPlayer =
        currentPlayer === 0
          ? 1
          : 0;


      const player =
        players[currentPlayer];


      if (
        player.skip
      ) {

        player.skip =
          false;


        const skippedName =
          player.name;


        currentPlayer =
          currentPlayer === 0
            ? 1
            : 0;


        messageBox.textContent =
          "💤 " +
          skippedName +
          "は1回休み！";


        updateUI();


        return;

      }


      messageBox.textContent =
        player.icon +
        " " +
        player.name +
        "のばん！";


      updateUI();

    }


    /* =====================================================
       ゴール
    ===================================================== */

    async function goalReached(player) {

      gameEnded =
        true;


      renderPieces();


      await practice();


      await showInfo(
        "🌌 GOAL！",
        player.icon +
        " " +
        player.name +
        "の勝ち！"
      );


      moving =
        false;


      rollButton.disabled =
        true;


      messageBox.textContent =
        "🎉 " +
        player.name +
        "が未知の惑星に到着！";

    }


    /* =====================================================
       情報
    ===================================================== */

    function showInfo(
      title,
      text
    ) {

      return new Promise(
        resolve => {

          infoTitle.textContent =
            title;


          infoText.textContent =
            text;


          infoModal.classList.add(
            "show"
          );


          const handler =
            () => {

              infoOK.removeEventListener(
                "click",
                handler
              );


              infoModal.classList.remove(
                "show"
              );


              resolve();

            };


          infoOK.addEventListener(
            "click",
            handler
          );

        }
      );

    }


    /* =====================================================
       ぴったりサイコロ
    ===================================================== */

    function chooseExactNumber() {

      return new Promise(
        resolve => {

          exactModal.classList.add(
            "show"
          );


          const buttons =
            exactModal.querySelectorAll(
              ".exactButton"
            );


          function choose(event) {

            buttons.forEach(
              button => {

                button.removeEventListener(
                  "click",
                  choose
                );

              }
            );


            exactModal.classList.remove(
              "show"
            );


            resolve(
              Number(
                event.currentTarget.dataset.value
              )
            );

          }


          buttons.forEach(
            button => {

              button.addEventListener(
                "click",
                choose
              );

            }
          );

        }
      );

    }


    /* =====================================================
       音を変更
    ===================================================== */

    changeSoundButton.addEventListener(
      "click",
      () => {

        if (
          moving
        ) {

          return;

        }


        app.style.display =
          "none";


        soundScreen.style.display =
          "flex";

      }
    );

  </script>

</body>
